name: Validate New vLLM Release

on:
  workflow_dispatch:
    inputs:
      lite:
        description: 'Run in lite mode (smallest model only)'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  schedule:
    # Sunday at 6:00 PM UTC
    - cron: "0 18 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEMONADE_CI_MODE: "True"
  PYTHONIOENCODING: utf-8
  HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
  LITE_MODE: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.lite == true) }}

jobs:
  # ========================================================================
  # Discover AMD's newest vLLM device-all bundle
  # ========================================================================
  get-latest-releases:
    name: Get latest vLLM bundle
    # Only the auto-update runs resolve upstream releases. Everywhere else the
    # build validates the pins committed in backend_versions.json, so a bad
    # upstream release can't fail a merge or hide a broken pin.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      vllm_rocm_release: ${{ steps.vllm_rocm.outputs.stem }}
      vllm_rocm_sha256: ${{ steps.vllm_rocm.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5

      - name: Find the newest dated bundle and its SHA-256
        id: vllm_rocm
        run: |
          set -euo pipefail
          python3 .github/scripts/update_vllm_pin.py discover | tee -a "$GITHUB_OUTPUT"

  # ========================================================================
  # Build binaries with updated backend version
  # ========================================================================
  build:
    name: Build (Linux)
    needs: get-latest-releases
    # Label a PR `ci:upgrades` to opt it back in.
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:upgrades')) && always() && !failure() && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0

      - name: Update backend_versions.json
        if: needs.get-latest-releases.result == 'success'
        env:
          VLLM_ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.vllm_rocm_release }}
          VLLM_ROCM_SHA256: ${{ needs.get-latest-releases.outputs.vllm_rocm_sha256 }}
        run: python3 .github/scripts/update_vllm_pin.py write "$VLLM_ROCM_RELEASE" "$VLLM_ROCM_SHA256"

      - name: Build lemond and the CLI
        run: |
          set -e
          ./setup.sh
          # Skip the web app; CI only exercises the backend.
          cmake -DBUILD_WEB_APP=OFF --preset default
          cmake --build --preset default --target lemond lemonade
          test -f build/lemond || { echo "lemond not found!"; exit 1; }
          test -f build/lemonade || { echo "lemonade not found!"; exit 1; }
          echo "Build successful!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vllm-build
          path: |
            build/lemond
            build/lemonade
            build/resources/
          retention-days: 7

  # ========================================================================
  # Validate backend on self-hosted runner
  # ========================================================================
  validate:
    name: Validate vllm (rocm)
    needs: [get-latest-releases, build]
    if: always() && needs.build.result == 'success'
    runs-on: [self-hosted, stx-halo, Linux, X64, lemon-prod]
    # A cold install downloads ~10 GB; this leaves room for ~2.3 MB/s on average.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: vllm-build
          path: build

      - name: Verify binaries
        run: |
          set -e
          chmod +x build/lemond build/lemonade
          ./build/lemond --version
          echo "Binaries verified!"

      - name: Setup Python and virtual environment
        uses: ./.github/actions/setup-venv
        with:
          venv-name: '.venv'
          python-version: '3.10'
          requirements-file: 'test/requirements.txt'

      - name: Set HF_HOME environment variable
        run: |
          # Persistent HF cache outside the workspace so model weights survive across
          # jobs. The checkout clean wipes untracked workspace files (#2103), and the
          # step below points HOME into the workspace, so the default cache location
          # would be re-downloaded on every run.
          HF_HOME="$HOME/.cache/lemonade-ci/huggingface"
          mkdir -p "$HF_HOME"
          echo "HF_HOME=$HF_HOME" >> "$GITHUB_ENV"

      - name: Check the C toolchain vllm-server needs
        run: |
          # Same check as the bundle's bin/vllm-server, which exits without these.
          has() { for d in /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do [ -e "$d/$1" ] && return 0; done; return 1; }
          if has crti.o && has libgomp.so.1; then
            echo "gcc toolchain present"
            exit 0
          fi
          echo "crti.o or libgomp.so.1 is missing; trying a non-interactive gcc install"
          if sudo -n true 2>/dev/null; then
            sudo -n apt-get update -qq || true
            sudo -n apt-get install -y -qq gcc || true
            if has crti.o && has libgomp.so.1; then
              echo "gcc installed"
              exit 0
            fi
          fi
          echo "::error::Runner $RUNNER_NAME is missing gcc (crti.o / libgomp.so.1), which vllm-server needs. Install it once on the runner: sudo apt install gcc"
          exit 1

      - name: Prepare the persistent vLLM backend cache
        run: |
          set -euo pipefail
          # The checkout clean wipes the workspace, so without this every run
          # would download the ~10 GB bundle. Each pin's SHA gets its own folder;
          # folders unused for 10 days are removed (a bot pin PR can wait days).
          ROOT="$HOME/.cache/lemonade-ci/vllm-bin"
          SHA=$(python3 -c 'import json; d = json.load(open("build/resources/backend_versions.json")); pin = d["vllm"]["rocm"]; print(d["checksums"]["vllm"]["rocm"][pin][pin + ".tar.gz"].split(":")[1])')
          KEY="$ROOT/${SHA:0:16}"
          mkdir -p "$KEY"
          exec 9>"$ROOT/.lock"
          flock -w 3600 9
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "Forcing a cold install on ${{ github.event_name }} runs"
            rm -rf "$KEY/rocm" "$KEY/rocm.staging" "$KEY/rocm.old"
          fi
          touch "$KEY"
          find "$ROOT" -mindepth 1 -maxdepth 1 -type d ! -path "$KEY" -mmin +$((10 * 24 * 60)) -print -exec rm -rf {} +
          df -h "$ROOT" "$RUNNER_TEMP"
          if [ ! -f "$KEY/rocm/version.txt" ]; then
            avail=$(df -BG --output=avail "$KEY" | tail -1 | tr -dc 0-9)
            if [ "$avail" -lt 45 ]; then
              echo "::error::A cold vLLM install needs 45 GB free on $ROOT; runner $RUNNER_NAME has ${avail} GB"
              exit 1
            fi
          fi
          echo "VLLM_BIN_KEY=$KEY" >> "$GITHUB_ENV"
          echo "VLLM_BIN_LOCK=$ROOT/.lock" >> "$GITHUB_ENV"

      - name: Run validation with lemond
        env:
          HOME: ${{ github.workspace }}/.home
        run: |
          set -e
          mkdir -p "$HOME"
          echo "HOME=$HOME" >> "$GITHUB_ENV"

          CACHE_DIR="$(pwd)/ci-cache-vllm"
          LOGS_DIR="$(pwd)/server-logs-rocm"
          mkdir -p "$CACHE_DIR" "$LOGS_DIR"

          # One job at a time may install into or run from the shared backend cache.
          exec 9>"$VLLM_BIN_LOCK"
          flock -w 3600 9 || { echo "ERROR: timed out waiting for the vLLM backend cache lock"; exit 1; }
          mkdir -p "$CACHE_DIR/bin"
          ln -sfn "$VLLM_BIN_KEY" "$CACHE_DIR/bin/vllm"
          VLLM_PIN=$(python3 -c 'import json; print(json.load(open("build/resources/backend_versions.json"))["vllm"]["rocm"])')
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"

          # This validate job runs on a shared self-hosted runner, so the default
          # port 13305 may already be held by another job. lemond now refuses to
          # bind an in-use port, so start on a job-unique free port and pass it to
          # validate_vllm.py and the shutdown call.
          pick_free_port() {
            if command -v python3 >/dev/null 2>&1; then
              python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()' && return 0
            fi
            for _ in $(seq 1 50); do
              local p=$(( (RANDOM % 20000) + 20000 ))
              if ! ss -ltn 2>/dev/null | grep -q ":$p "; then echo "$p"; return 0; fi
            done
            return 1
          }

          LEMOND_PID=""
          started=0
          for start_attempt in $(seq 1 5); do
            PORT=$(pick_free_port) || { echo "ERROR: could not find a free port"; exit 1; }
            echo "Attempt $start_attempt: starting lemond on 127.0.0.1:$PORT..."
            # 9>&-: lemond and vLLM must not hold the cache lock after this step.
            ./build/lemond "$CACHE_DIR" --port "$PORT" --host 127.0.0.1 9>&- \
              > "$LOGS_DIR/lemond.stdout.log" 2> "$LOGS_DIR/lemond.stderr.log" &
            LEMOND_PID=$!
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$PORT/api/v1/health" > /dev/null 2>&1; then
                echo "lemond is healthy on port $PORT (PID $LEMOND_PID)"
                started=1
                break
              fi
              if ! kill -0 "$LEMOND_PID" 2>/dev/null; then
                echo "lemond (PID $LEMOND_PID) exited prematurely on port $PORT"
                cat "$LOGS_DIR/lemond.stderr.log" 2>/dev/null || true
                break
              fi
              sleep 2
            done
            [ "$started" = "1" ] && break
            echo "Start attempt $start_attempt failed; retrying on a new port..."
            kill -9 "$LEMOND_PID" 2>/dev/null || true
            sleep 1
          done
          if [ "$started" != "1" ]; then
            echo "ERROR: lemond failed to start after multiple attempts"
            exit 1
          fi

          EXIT_CODE=0
          VALIDATION_ARGS=(
            test/validate_vllm.py
            --backend rocm
            --port "$PORT"
            --output vllm_validation_rocm.json
            --logs-dir "$LOGS_DIR"
            --expected-pin "$VLLM_PIN"
          )
          if [ "${LITE_MODE}" = "true" ]; then
            VALIDATION_ARGS+=(--lite)
          fi

          .venv/bin/python "${VALIDATION_ARGS[@]}" || EXIT_CODE=$?

          # Shut the server down cleanly so logs flush, and stop everything this
          # job started before the cache lock is released to the next job.
          curl -sf -X POST "http://127.0.0.1:$PORT/internal/shutdown" || true
          for _ in $(seq 1 15); do kill -0 "$LEMOND_PID" 2>/dev/null || break; sleep 1; done
          kill -9 "$LEMOND_PID" 2>/dev/null || true
          pkill -9 -f "$CACHE_DIR/" 2>/dev/null || true

          exit $EXIT_CODE

      - name: Re-record the API examples the new backend serves
        # An example changes only when the new backend changes its response's shape,
        # so the update PR carries no churn from new values.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          cp build/resources/backend_versions.json src/cpp/resources/backend_versions.json
          .venv/bin/python docs/tools/gen_api_boilerplate.py --lemond build/lemond

      - name: Upload recorded API examples
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: api-examples
          path: |
            docs/tools/api_examples_cache.json
            docs/api/
          retention-days: 7

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results-rocm
          path: vllm_validation_rocm.json
          retention-days: 30

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-rocm
          path: server-logs-rocm/
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        # Kills only this workspace's processes; another job may hold the runner's vLLM cache.
        uses: ./.github/actions/cleanup-processes-linux

  # ========================================================================
  # Create PR if validation passed (schedule or workflow_dispatch only)
  # ========================================================================
  create-pr:
    name: Create update PR
    needs: [get-latest-releases, validate, gpu-offload-gate]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.validate.result == 'success' &&
      needs.gpu-offload-gate.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Download recorded API examples
        uses: actions/download-artifact@v7
        with:
          name: api-examples
          path: docs

      - name: Download validation results
        uses: actions/download-artifact@v7
        with:
          pattern: validation-results-*
          merge-multiple: true

      - name: Update backend_versions.json
        env:
          VLLM_ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.vllm_rocm_release }}
          VLLM_ROCM_SHA256: ${{ needs.get-latest-releases.outputs.vllm_rocm_sha256 }}
        run: python3 .github/scripts/update_vllm_pin.py write "$VLLM_ROCM_RELEASE" "$VLLM_ROCM_SHA256"

      - name: Generate PR body
        env:
          VLLM_ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.vllm_rocm_release }}
        run: |
          python3 << 'PYEOF'
          import json, os

          lines = []
          rocm = os.environ.get("VLLM_ROCM_RELEASE", "unknown")

          lines.append("## Auto-update vLLM backend")
          lines.append("")
          lines.append(f"- **vLLM ROCm bundle**: `{rocm}`")
          lines.append("")
          lines.append("## Validation Results")
          lines.append("")
          lines.append("| Model | Result | GPU | Response | input_tokens | output_tokens | time_to_first_token | tokens_per_second |")
          lines.append("|-------|--------|-----|----------|--------------|---------------|---------------------|-------------------|")

          results_file = "vllm_validation_rocm.json"
          if not os.path.isfile(results_file):
              lines.append("| _rocm: no results_ | | | | | | | |")
          else:
              with open(results_file) as f:
                  results = json.load(f)
              for r in results:
                  status = "PASS" if r["pass"] else "FAIL"
                  gpu = r.get("gpu", "N/A")
                  resp = str(r.get("response", ""))[:80].replace("|", "\\|").replace("\n", " ")
                  ttft = r.get("time_to_first_token", "N/A")
                  if isinstance(ttft, float):
                      ttft = f"{ttft:.3f}s"
                  tps = r.get("tokens_per_second", "N/A")
                  if isinstance(tps, float):
                      tps = f"{tps:.1f}"
                  lines.append(
                      f"| {r['model']} (rocm) | {status} | {gpu} | {resp} | "
                      f"{r.get('input_tokens', 'N/A')} | {r.get('output_tokens', 'N/A')} | "
                      f"{ttft} | {tps} |"
                  )

          lines.append("")
          lines.append("---")
          lines.append("*Auto-generated by validate_vllm workflow*")

          with open("pr_body.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VLLM_ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.vllm_rocm_release }}
        run: |
          BRANCH="auto/vllm-update-${VLLM_ROCM_RELEASE}"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet src/cpp/resources/backend_versions.json; then
            echo "backend_versions.json is unchanged — nothing to update."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add src/cpp/resources/backend_versions.json docs/tools/api_examples_cache.json docs/api
          git commit -m "Update vLLM ROCm bundle to ${VLLM_ROCM_RELEASE}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Update vLLM ROCm bundle to ${VLLM_ROCM_RELEASE}" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH"

  gpu-offload-gate:
    name: GPU offload gate
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download validation evidence
        uses: actions/download-artifact@v7
        with:
          pattern: validation-results-*
          merge-multiple: true

      - name: Enforce GPU offload
        run: python3 .github/scripts/check_gpu_offload.py 'vllm_validation_*.json'

  # Gate job that ensures: 1. in the merge queue, all jobs in `needs:` ran
  # successfully (otherwise the merge is blocked), and 2. these jobs do not need
  # to run on ordinary pull request pushes.
  validation-gate:
    name: vLLM validation
    needs: [build, validate, gpu-offload-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gated jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # $NEEDS: {"job-id": {"result": "success|failure|skipped|cancelled"}, ...}
          # Fail if any job broke. In the merge queue, also fail if any never ran.
          echo "$NEEDS"
          broke=$(jq -r 'to_entries[]|select(.value.result=="failure" or .value.result=="cancelled")|.key' <<<"$NEEDS")
          if [ -n "$broke" ]; then
            echo "FAILED: $broke"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            absent=$(jq -r 'to_entries[]|select(.value.result!="success")|.key' <<<"$NEEDS")
            if [ -n "$absent" ]; then
              echo "DID NOT RUN IN MERGE QUEUE: $absent"
              exit 1
            fi
          fi
