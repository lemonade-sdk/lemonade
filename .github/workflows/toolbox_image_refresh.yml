name: Refresh Toolbox Image Pins

# The toolbox images are rebuilt whenever upstream llama.cpp master moves, which
# is most days. Lemonade pins them by digest so a release always runs the bytes
# it was tested against; this workflow is what moves those pins forward, as a PR
# a human reviews. Nothing merges automatically.

on:
  workflow_dispatch:
  schedule:
    # Monday at 05:40 UTC, ahead of the catalog diff so a digest bump and a
    # catalog change do not land in the same PR.
    - cron: "40 5 * * 1"

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve image digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve current digests
        id: resolve
        run: |
          python3 docs/tools/gen_toolbox_catalog.py pins --write | tee pin_report.txt
          if git diff --quiet src/cpp/resources/backend_versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the PR body
        if: steps.resolve.outputs.changed == 'true'
        run: |
          {
            echo "Sweet - the upstream toolbox images moved, so these digest pins do too."
            echo
            echo "\`tag\` is unchanged in every case; only the digest each tag now resolves to"
            echo "has moved. Merging this makes Lemonade install the newer image."
            echo
            echo '```'
            cat pin_report.txt
            echo '```'
            echo
            echo "### Verification"
            echo
            echo "The backend matrix has no gfx1151 or gfx1201 runner, so these digests are"
            echo "not exercised by CI. Someone with the hardware should load a model on the"
            echo "affected variants before merging."
          } > pr_body.md

      - name: Open the bump PR
        if: steps.resolve.outputs.changed == 'true'
        run: |
          BRANCH="toolbox-pins-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/cpp/resources/backend_versions.json
          git commit -m "Refresh toolbox image digest pins"
          git push origin "$BRANCH"
          gh pr create \
            --title "Refresh toolbox image digest pins" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH"

      - name: Report no change
        if: steps.resolve.outputs.changed != 'true'
        run: echo "Every pinned tag still resolves to the committed digest."
