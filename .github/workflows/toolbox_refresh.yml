name: Refresh Toolbox Pins and Catalog

# Donato Capitella's toolbox images are rebuilt whenever upstream llama.cpp
# master moves, and his AI Toolbox Cockpit catalog is where their curated models
# live. Lemonade pins images by digest and translates the catalog into model
# entries. This workflow moves both forward in ONE PR, because neither file
# records the dependency between them: a model added upstream may need the newer
# build of a tag, or the catalog may move to a tag Lemonade has not pinned yet.
# Nothing merges automatically; a maintainer loads the affected models on
# gfx1151 hardware before merging.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * 1"

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve digests and regenerate catalog entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve current digests
        run: python3 docs/tools/gen_toolbox_catalog.py pins --write | tee pin_report.txt

      - name: Summarize what changed upstream
        run: python3 docs/tools/gen_toolbox_catalog.py report | tee catalog_report.md

      - name: Regenerate the catalog-owned model entries
        run: python3 docs/tools/gen_toolbox_catalog.py models --write | tee models_report.txt

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet src/cpp/resources/backend_versions.json src/cpp/resources/server_models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git diff --quiet src/cpp/resources/backend_versions.json && echo "pins=false" >> "$GITHUB_OUTPUT" || echo "pins=true" >> "$GITHUB_OUTPUT"
          git diff --quiet src/cpp/resources/server_models.json && echo "models=false" >> "$GITHUB_OUTPUT" || echo "models=true" >> "$GITHUB_OUTPUT"

      - name: Build the PR body
        if: steps.detect.outputs.changed == 'true'
        run: |
          {
            echo "Sweet - Donato's toolboxes moved upstream. This PR carries every change"
            echo "from this week's refresh in one place, because a catalog change can depend"
            echo "on a digest bump and neither file records that."
            echo
            if [ "${{ steps.detect.outputs.pins }}" = "true" ]; then
              echo "### Digest pins"
              echo
              echo "\`tag\` is unchanged in every case; only the digest each tag now resolves to"
              echo "has moved. Merging this makes Lemonade install the newer image."
              echo
              echo '```'
              cat pin_report.txt
              echo '```'
              echo
            fi
            if [ "${{ steps.detect.outputs.models }}" = "true" ]; then
              echo "### Catalog model entries"
              echo
              echo "Regenerated entries are the ones marked \`catalog_source: ai-toolbox-cockpit\`;"
              echo "the hand-curated ROCmFPX picks are untouched. A model added upstream arrives"
              echo "with a slug for a name: give it a short one in \`NAME_OVERRIDES\` before merging."
              echo
              echo '```'
              cat models_report.txt
              echo '```'
              echo
            fi
            echo "### Upstream diff"
            echo
            cat catalog_report.md
            echo
            echo "### Verification"
            echo
            echo "The backend matrix has no gfx1151 runner, so nothing here is exercised by CI."
            echo "Load a model on every affected variant on Strix Halo hardware before merging."
          } > pr_body.md

      - name: Open the refresh PR
        if: steps.detect.outputs.changed == 'true'
        run: |
          BRANCH="toolbox-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/cpp/resources/backend_versions.json src/cpp/resources/server_models.json
          git commit -m "Refresh toolbox image pins and catalog model entries"
          git push origin "$BRANCH"
          gh pr create \
            --title "Refresh toolbox image pins and catalog model entries" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH"

      - name: Publish the report when nothing needs a PR
        if: steps.detect.outputs.changed != 'true'
        run: |
          echo "Every pinned tag still resolves to the committed digest and the catalog entries are up to date." >> "$GITHUB_STEP_SUMMARY"
          cat catalog_report.md >> "$GITHUB_STEP_SUMMARY"
