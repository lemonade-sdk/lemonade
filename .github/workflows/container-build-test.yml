# .github/workflows/container-build-test.yml

name: Container Build Tests

on:
  pull_request:
    paths:
      - Dockerfile
      - .ubuntu/Dockerfile
      - .dockerignore
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - contrib/debian/**
      - src/cpp/**
      - src/web-app/**
      - .github/workflows/build-and-push-container.yml
      - .github/workflows/build-container.yml
      - .github/workflows/container-build-test.yml

  workflow_dispatch:
    inputs:
      upload_arm64_artifact:
        description: Upload the ARM64 image for external testing
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke-test:
    name: Build and smoke test (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest

          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: lemonade-server:test-${{ matrix.arch }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}

      - name: Verify image architecture
        shell: bash
        run: |
          set -euo pipefail

          actual_arch="$(
            docker image inspect \
              "lemonade-server:test-${{ matrix.arch }}" \
              --format '{{.Architecture}}'
          )"

          if [[ "${actual_arch}" != "${{ matrix.arch }}" ]]; then
            echo "Expected ${{ matrix.arch }}, got ${actual_arch}"
            exit 1
          fi

      - name: Verify CLI starts
        run: |
          docker run --rm \
            "lemonade-server:test-${{ matrix.arch }}" \
            lemonade --help

      - name: Verify runtime C toolchain
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            "lemonade-server:test-${{ matrix.arch }}" \
            bash -c 'set -euo pipefail
              tmp="$(mktemp -d)"
              printf "%s\n" "#include <stdlib.h>" "void launcher(void) {}" > "${tmp}/launcher.c"
              gcc -O3 -shared -fPIC -o "${tmp}/launcher.so" "${tmp}/launcher.c"
              test -f "${tmp}/launcher.so"
              '

      - name: Start server
        run: |
          docker run --detach \
            --name lemonade-smoke \
            --publish 127.0.0.1:13305:13305 \
            "lemonade-server:test-${{ matrix.arch }}"

      - name: Check server health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:13305/live \
              > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Server failed to become healthy"
          docker logs lemonade-smoke
          exit 1

      - name: Show server logs
        if: failure()
        run: docker logs lemonade-smoke || true

      - name: Stop server
        if: always()
        run: docker rm --force lemonade-smoke || true

      - name: Export ARM64 image
        if: >-
          matrix.arch == 'arm64' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_arm64_artifact
        shell: bash
        run: |
          set -euo pipefail

          docker save "lemonade-server:test-arm64" \
            | gzip -1 \
            > lemonade-server-arm64.tar.gz

      - name: Upload ARM64 test image
        if: >-
          matrix.arch == 'arm64' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_arm64_artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemonade-server-arm64-${{ github.sha }}
          path: lemonade-server-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-environment-image:
    name: Build and verify the build-environment image
    # build-container.yml publishes this image on a nightly schedule only, so
    # without this job a change to .ubuntu/Dockerfile would first be exercised
    # at 2 AM against the tag every Linux CI job pulls.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .ubuntu/Dockerfile
          build-args: |
            BASE_IMAGE=ubuntu:24.04
            UBUNTU_PPA=ppa:lemonade-team/bleeding-edge
          platforms: linux/amd64
          load: true
          push: false
          tags: lemonade-build-environment:test

      - name: Verify the compiler cache was primed
        shell: bash
        run: |
          set -euo pipefail

          # An empty cache means the prime silently produced nothing, which
          # would leave every .deb build compiling from scratch again. Measured
          # on the directory rather than `ccache -s` output, which is not a
          # stable parsing target across ccache versions.
          docker run --rm lemonade-build-environment:test ccache -s

          size_mb="$(
            docker run --rm lemonade-build-environment:test \
              du -sm /opt/ccache | cut -f1
          )"
          # Every container job pulls this image, so the cache earning its place
          # depends on it staying small relative to the build time it saves.
          echo "Primed ccache size: ${size_mb} MB"
          if [ "$size_mb" -lt 50 ]; then
            echo "ERROR: the primed ccache is essentially empty"
            exit 1
          fi
          if [ "$size_mb" -gt 1200 ]; then
            echo "ERROR: the primed ccache exceeds the 1G cap set in the Dockerfile"
            exit 1
          fi
