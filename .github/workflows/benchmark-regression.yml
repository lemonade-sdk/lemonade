name: Nightly Backend Perf Regression

on:
  schedule:
    - cron: '0 2 * * *'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      fork_filter:
        description: 'Comma-separated fork_ids (blank = all tracked)'
        required: false
        default: ''
      model_filter:
        description: 'Comma-separated model names (blank = all hot models)'
        required: false
        default: ''
      model_groups:
        description: 'Parallel machines; each runs every backend on its share of the hot models'
        required: false
        default: '4'

# Only contents:write is needed — the report job pushes results to the
# benchmark-data branch. No issues/PRs are created (regressions are tracked in
# benchmark-data/regressions.json for the dashboard, not via GitHub issues).
permissions:
  contents: write

# Never let two runs overlap: parallel benches on the same box would share the
# GPU and corrupt perf numbers, and both would race to push benchmark history.
concurrency:
  group: benchmark-regression
  cancel-in-progress: false

env:
  LEMONADE_CI_MODE: "True"
  PYTHONIOENCODING: utf-8
  HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Branch that accumulates nightly results + leaderboard. This is what makes
  # day-over-day regression detection possible at all.
  HISTORY_BRANCH: benchmark-data

jobs:
  # =========================================================================
  # Setup — build the fork matrix dynamically from src/cpp/resources/benchmark_forks.json.
  # Single source of truth: adding a fork (llamacpp fork, vllm fork, ...) to
  # the JSON is enough; no workflow edit needed. Honors the fork_filter
  # workflow_dispatch input.
  # =========================================================================
  setup:
    name: Build fork matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      forks: ${{ steps.matrix.outputs.forks }}
      groups: ${{ steps.matrix.outputs.groups }}
    steps:
      - uses: actions/checkout@v5

      - name: Read tracked forks
        id: matrix
        env:
          FORK_FILTER: ${{ inputs.fork_filter }}
          MODEL_FILTER: ${{ inputs.model_filter }}
          MODEL_GROUPS: ${{ inputs.model_groups || '4' }}
        run: |
          python3 - << 'PY'
          import json, os, sys
          from pathlib import Path
          forks = json.loads(Path("src/cpp/resources/benchmark_forks.json").read_text())["forks"]
          # tracked:true forks; optional per-fork opt-out via {"enabled": false}
          ids = [f["fork_id"] for f in forks
                 if f.get("tracked", True) and f.get("enabled", True)]
          flt = [s.strip() for s in os.environ.get("FORK_FILTER", "").split(",") if s.strip()]
          if flt:
            unknown = [s for s in flt if s not in ids]
            if unknown:
              print(f"ERROR: fork_filter entries not in benchmark_forks.json: {unknown}")
              sys.exit(1)
            ids = [i for i in ids if i in flt]
          if not ids:
            print("ERROR: no forks selected")
            sys.exit(1)
          print(f"Benching forks: {ids}")
          registry = json.loads(Path("src/cpp/resources/server_models.json").read_text())
          models = [m.strip() for m in os.environ.get("MODEL_FILTER", "").split(",") if m.strip()]
          if not models:
            models = [k for k, v in registry.items() if isinstance(v, dict)
                      and v.get("recipe") == "llamacpp" and "hot" in v.get("labels", [])]
          size = lambda m: (registry.get(m) or {}).get("size") or 1
          n = max(1, min(int(os.environ.get("MODEL_GROUPS") or 4), len(models)))
          bins, load = [[] for _ in range(n)], [0.0] * n
          # Largest first onto the lightest machine, so per-machine work is even.
          for m in sorted(models, key=size, reverse=True):
            k = load.index(min(load))
            bins[k].append(m)
            load[k] += size(m)
          groups = [{"name": f"group-{k + 1}", "models": ",".join(sorted(b))} for k, b in enumerate(bins) if b]
          for g, l in zip(groups, load):
            print(f"{g['name']} (~{l:.0f} GB): {g['models']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"forks={json.dumps(ids)}\n")
            f.write(f"groups={json.dumps(groups)}\n")
          PY

  # =========================================================================
  # Bench — one job per model group. Each job runs EVERY backend on the same
  # machine, one after another, so backends are compared on identical hardware;
  # groups run in parallel on separate devlab machines.
  # =========================================================================
  bench:
    name: Bench ${{ matrix.group.name }}
    needs: [setup]
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.setup.outputs.groups) }}

    steps:
      - uses: actions/checkout@v5
        with:
          clean: true

      - name: Download lemonade embeddable
        run: |
          set -euo pipefail
          RELEASE=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lemonade-sdk/lemonade/releases/latest")
          VERSION=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "Latest lemonade: $VERSION"
          ASSET_URL=$(echo "$RELEASE" | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; url=next((a['browser_download_url'] for a in assets if 'embeddable' in a['name'] and 'ubuntu' in a['name'] and 'x64' in a['name']),None); print(url or 'NOT_FOUND')")
          if [ "$ASSET_URL" = "NOT_FOUND" ]; then
            echo "ERROR: no ubuntu embeddable asset found. Available assets:"
            echo "$RELEASE" | python3 -c "import sys,json; [print(a['name']) for a in json.load(sys.stdin)['assets']]"
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          mkdir -p build
          curl -sfL "$ASSET_URL" | tar -xz --strip-components=1 -C build/
          test -f build/lemond   || { echo "ERROR: lemond missing from embeddable package"; ls -la build/; exit 1; }
          test -f build/lemonade || { echo "ERROR: lemonade missing from embeddable package"; ls -la build/; exit 1; }
          test -d build/resources || { echo "ERROR: resources/ missing — embeddable package incomplete"; ls -la build/; exit 1; }
          chmod +x build/lemond build/lemonade
          build/lemond --version
          echo "Lemonade $VERSION ready"
          echo "LEMONADE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # validate_backend_bench.py compares against prior run-*.json files in
      # --output/<fork>/<model>/, so restore history into that layout.
      - name: Restore benchmark history
        env:
          FORKS: ${{ needs.setup.outputs.forks }}
        run: |
          set -e
          mkdir -p ci/results
          if git fetch origin "$HISTORY_BRANCH" 2>/dev/null; then
            mkdir -p .bench-history
            git archive FETCH_HEAD | tar -x -C .bench-history
            for FORK_ID in $(echo "$FORKS" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
              if [ -d ".bench-history/results/$FORK_ID" ]; then
                cp -r ".bench-history/results/$FORK_ID" ci/results/
                echo "Restored $(find "ci/results/$FORK_ID" -name 'run-*.json' | wc -l) prior run(s) for $FORK_ID"
              fi
            done
          else
            echo "No $HISTORY_BRANCH branch yet (first run overall)"
          fi

      - name: Download fork binaries
        env:
          FORKS: ${{ needs.setup.outputs.forks }}
        run: |
          set -e
          python3 .github/scripts/validate_backend_bench.py \
            --forks        src/cpp/resources/benchmark_forks.json \
            --output       ci/results \
            --binaries-dir "${{ github.workspace }}/../bench-binaries" \
            --fork-filter  "$(echo "$FORKS" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)))')" \
            --download-only

      - name: Run every backend on this machine
        env:
          HOME: ${{ github.workspace }}/.home
          FORKS: ${{ needs.setup.outputs.forks }}
          GROUP_MODELS: ${{ matrix.group.models }}
        run: |
          set -u
          mkdir -p "$HOME"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "Models on this machine: $GROUP_MODELS"

          # Persistent caches OUTSIDE the workspace (checkout clean:true wipes
          # the workspace). Model files are shared by every backend in this job;
          # each backend gets its own config dir so routing never leaks between them.
          BENCH_ROOT="$(cd "${{ github.workspace }}/.." && pwd)"
          CACHE_DIR="$BENCH_ROOT/lemond-bench-cache"
          export HF_HOME="$BENCH_ROOT/hf-cache"
          mkdir -p "$CACHE_DIR" "$HF_HOME"
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          LEMONADE="$(pwd)/build/lemonade"

          pick_free_port() {
            python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()'
          }

          wait_lemond() {
            for _ in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$PORT/api/v1/health" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            return 1
          }

          start_lemond() {
            for start_attempt in $(seq 1 5); do
              PORT=$(pick_free_port) || return 1
              echo "Attempt $start_attempt: starting lemond on 127.0.0.1:$PORT..."
              build/lemond "$CACHE_DIR" "$CFG_DIR" --port "$PORT" --host 127.0.0.1 \
                > "$LOGS_DIR/lemond.stdout.log" 2> "$LOGS_DIR/lemond.stderr.log" &
              LEMOND_PID=$!
              if wait_lemond; then echo "lemond healthy on port $PORT (PID $LEMOND_PID)"; return 0; fi
              echo "Start attempt $start_attempt failed; retrying on a new port..."
              kill -9 "$LEMOND_PID" 2>/dev/null || true
              sleep 1
            done
            return 1
          }

          stop_lemond() {
            curl -sf -X POST "http://127.0.0.1:$PORT/internal/shutdown" >/dev/null 2>&1 || true
            sleep 2
            kill -9 "$LEMOND_PID" 2>/dev/null || true
            pkill -9 -f "bench-binaries/$FORK_ID" 2>/dev/null || true
          }

          purge_fresh_results() {
            find "ci/results/$FORK_ID" -name 'run-*.json' 2>/dev/null | sort > /tmp/post-bench-files || true
            comm -13 /tmp/pre-bench-files /tmp/post-bench-files | xargs -r rm --
          }

          bench_one_fork() {
            # Resolve the config target: the real backend key + the FULL PATH to
            # the llama-server file. lemond execs <section>.<key>_bin verbatim, so
            # a directory value fails with EISDIR and /load 500.
            eval "$(FORK_ID="$FORK_ID" python3 - << 'PY'
          import json, os, shlex
          from pathlib import Path
          forks = json.loads(Path("src/cpp/resources/benchmark_forks.json").read_text())["forks"]
          fork = next(f for f in forks if f["fork_id"] == os.environ["FORK_ID"])
          models = [m for m in os.environ["GROUP_MODELS"].split(",") if m]
          aliases = fork.get("model_aliases")
          runnable = any(m in aliases.values() for m in models) if aliases else True
          exe = fork.get("binary_exe_linux", "llama-server")
          bindir = Path(os.environ["GITHUB_WORKSPACE"]) / ".." / "bench-binaries" / fork["fork_id"]
          binary = next(bindir.rglob(exe), None)
          recipe = fork.get("recipe", "llamacpp")
          for k, v in {
            "RUNNABLE": "1" if runnable else "0",
            "BENCH_BACKEND_KEY": fork.get("install_as", fork["backend"]).lower(),
            "BENCH_RECIPE": recipe,
            "BENCH_CONFIG_SECTION": fork.get("config_section", recipe),
            "BENCH_ROCM_CHANNEL": fork.get("rocm_channel", ""),
            "BENCH_BIN_FILE": str(binary.resolve()) if binary else "",
          }.items():
            print(f"{k}={shlex.quote(v)}")
          PY
            )"
            if [ "$RUNNABLE" != "1" ]; then
              echo "No models for $FORK_ID on this machine; skipping."
              return 0
            fi
            if [ -z "$BENCH_BIN_FILE" ]; then
              echo "ERROR: fork binary for $FORK_ID not found"; return 1
            fi
            BENCH_BIN_DIR="$(dirname "$BENCH_BIN_FILE")"
            LOGS_DIR="$(pwd)/server-logs/$FORK_ID"
            CFG_DIR="$BENCH_ROOT/lemond-config/$FORK_ID"
            rm -rf "$CFG_DIR"
            mkdir -p "$LOGS_DIR" "$CFG_DIR"

            start_lemond || { echo "ERROR: lemond failed to start for $FORK_ID"; return 1; }

            # Set rocm_channel and *_bin in ONE `config set`: two back-to-back
            # calls left lemond mid-reload and the second call was dropped.
            KEY="${BENCH_CONFIG_SECTION}.${BENCH_BACKEND_KEY}_bin"
            SET_ARGS=("$KEY=$BENCH_BIN_FILE")
            [ -n "$BENCH_ROCM_CHANNEL" ] && SET_ARGS+=("rocm_channel=$BENCH_ROCM_CHANNEL")
            echo "Routing (atomic): config set ${SET_ARGS[*]}"
            if ! "$LEMONADE" --port "$PORT" config set "${SET_ARGS[@]}"; then
              wait_lemond && "$LEMONADE" --port "$PORT" config set "${SET_ARGS[@]}" \
                || { echo "ERROR: config set failed for $FORK_ID"; stop_lemond; return 1; }
            fi
            wait_lemond || { echo "ERROR: lemond not healthy after routing $FORK_ID"; stop_lemond; return 1; }

            if ! curl -sf "http://127.0.0.1:$PORT/api/v1/system-info" 2>/dev/null \
                | BACKEND="$BENCH_BACKEND_KEY" RECIPE="$BENCH_RECIPE" python3 -c '
          import json, os, sys
          recipe, key = os.environ["RECIPE"], os.environ["BACKEND"]
          state = json.load(sys.stdin).get("recipes", {}).get(recipe, {}).get("backends", {}).get(key, {}).get("state", "missing")
          print(f"  {recipe}.{key} state = {state}")
          sys.exit(0 if state in ("installed", "update_required", "update_available") else 1)
          '; then
              echo "ERROR: system-info never reported '$BENCH_BACKEND_KEY' installed for $FORK_ID"
              stop_lemond; return 1
            fi

            # Smoke-test the binary directly so missing libs / bad HIP init show
            # their real error instead of an opaque /load 500 later.
            if ! LD_LIBRARY_PATH="$BENCH_BIN_DIR:${LD_LIBRARY_PATH:-}" "$BENCH_BIN_FILE" --version \
                > "$LOGS_DIR/fork-binary-version.txt" 2>&1; then
              cat "$LOGS_DIR/fork-binary-version.txt" || true
              LD_LIBRARY_PATH="$BENCH_BIN_DIR:${LD_LIBRARY_PATH:-}" ldd "$BENCH_BIN_FILE" 2>&1 | grep -i "not found" || true
              echo "ERROR: fork binary for $FORK_ID failed to run"
              stop_lemond; return 1
            fi

            find "ci/results/$FORK_ID" -name 'run-*.json' 2>/dev/null | sort > /tmp/pre-bench-files || true
            LEMONADE_EXE="$LEMONADE" python3 .github/scripts/validate_backend_bench.py \
              --forks        src/cpp/resources/benchmark_forks.json \
              --output       ci/results \
              --binaries-dir "${{ github.workspace }}/../bench-binaries" \
              --fork-filter  "$FORK_ID" \
              --model-filter "$GROUP_MODELS" \
              --port         "$PORT" \
              || { tail -n 80 "$LOGS_DIR/lemond.stderr.log" 2>/dev/null || true; }
            if [ -f ci/results/regression_report.json ]; then
              mkdir -p "ci/results/$FORK_ID"
              mv ci/results/regression_report.json "ci/results/$FORK_ID/regression_report.json"
            fi
            stop_lemond

            # Refuse to publish numbers unless the fork binary actually served them.
            if ! grep -rqs "$BENCH_BIN_FILE" "$LOGS_DIR"; then
              echo "ERROR: no evidence lemond launched $BENCH_BIN_FILE — dropping $FORK_ID results"
              purge_fresh_results; return 1
            fi
            fresh=$(comm -13 /tmp/pre-bench-files <(find "ci/results/$FORK_ID" -name 'run-*.json' 2>/dev/null | sort) | xargs -r grep -l '"tps"' 2>/dev/null | wc -l)
            if [ "$fresh" = "0" ]; then
              echo "ERROR: no model produced a valid result for $FORK_ID"
              grep -rniE "terminated with exit code|Failed to execute|llama-server failed to start" "$LOGS_DIR" | head -n 20 || true
              return 1
            fi
            echo "$FORK_ID: $fresh model(s) produced results"
          }

          FAILED=()
          for FORK_ID in $(echo "$FORKS" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            echo "::group::$FORK_ID"
            bench_one_fork || FAILED+=("$FORK_ID")
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Backends that failed on this machine: ${FAILED[*]}"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.group.name }}-${{ github.run_id }}
          path: ci/results/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload lemond logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lemond-logs-${{ matrix.group.name }}-${{ github.run_id }}
          path: server-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-processes-linux

      - name: Cleanup fork binaries processes
        if: always()
        run: |
          pkill -9 -f "bench-binaries/" 2>/dev/null || true

  # =========================================================================
  # Report — merges results into the benchmark-data branch, regenerates the
  # leaderboard from full history, files/updates an issue on critical
  # regression.
  # =========================================================================
  report:
    name: Aggregate and report
    needs: bench
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Each artifact lands in its own subdirectory (artifacts/bench-results-
      # <fork>-<runid>/). Deliberately NOT merge-multiple: forks may write
      # identically-named files (e.g. regression_report.json) and merging
      # would silently overwrite all but one.
      - name: Download all bench results
        uses: actions/download-artifact@v7
        with:
          pattern: bench-results-*
          path: artifacts

      - name: Merge results into history branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch origin "$HISTORY_BRANCH:$HISTORY_BRANCH" 2>/dev/null; then
            echo "Creating $HISTORY_BRANCH (root commit)"
            git branch "$HISTORY_BRANCH" \
              "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m 'init benchmark history')"
          fi
          git worktree add bench-history "$HISTORY_BRANCH"
          python3 - << 'PY'
          import json, shutil
          from pathlib import Path
          dest_root = Path("bench-history/results")
          counts = {}
          for f in sorted(Path("artifacts").rglob("run-*.json")):
            if "regression" in f.name:
              continue
            try:
              data = json.loads(f.read_text())
            except Exception as e:
              print(f"  [skip] {f}: unreadable ({e})")
              continue
            fork = data.get("fork_id")
            if not fork:
              print(f"  [skip] {f}: no fork_id field")
              continue
            model = f.parent.name
            dest = dest_root / fork / model / f.name
            dest.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy(f, dest)
            counts[fork] = counts.get(fork, 0) + 1
          for fork in sorted(counts):
            total = len(list((dest_root / fork).rglob("run-*.json")))
            print(f"{fork}: +{counts[fork]} this run, {total} run file(s) in history")
          if not counts:
            print("WARNING: no run files found in artifacts/ — nothing merged")
          PY

      - name: Aggregate leaderboard (full history)
        run: |
          python3 - << 'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone
          # Full history, so the leaderboard keeps entries for forks that were
          # filtered out of (or failed in) today's run. Sorted iteration +
          # per-fork replacement means the newest run per fork wins.
          results_dir = Path("bench-history/results")
          leaderboard = {}
          systems = {}          # hw fingerprint -> hardware block (dedup across runs)
          lemonade_versions = set()
          # Active scenario -> required ctx; other ctx/scenarios not rendered.
          SCENARIO_CTX = {"context-4k": 4096, "context-32k": 32768}

          _QUANT_RE = re.compile(r"(IQ\d+_\w+|Q\d+(?:_[A-Z0-9]+)*|BF16|F16|F32|MXFP4)", re.I)
          def quant_from_checkpoint(me, data):
            ck = (me.get("checkpoints") or {}).get("main") or data.get("checkpoint") or ""
            fname = ck.split(":")[-1]
            m = _QUANT_RE.search(fname)
            return m.group(1).upper() if m else None

          def hw_fingerprint(hw):
            gpu = hw.get("gpu") or []
            vram = gpu[0].get("vram_gb") if gpu and isinstance(gpu[0], dict) else None
            return "|".join(str(x) for x in (hw.get("cpu"), vram, hw.get("os")))

          def _gpu_label(gpu_list):
            for g in (gpu_list or []):
              name = g.get("name", "") if isinstance(g, dict) else ""
              m = re.search(r"gfx\d+", name)
              if m:
                return m.group(0)
            for g in (gpu_list or []):
              name = g.get("name", "") if isinstance(g, dict) else ""
              if name and not name.strip().isdigit():
                return name
            first = (gpu_list or [{}])[0]
            return first.get("name") if isinstance(first, dict) else None

          forks_config = json.loads(Path("src/cpp/resources/benchmark_forks.json").read_text())
          experimental_forks = [f["fork_id"] for f in forks_config["forks"] if f.get("experimental", False)]
          server_models = json.loads(Path("src/cpp/resources/server_models.json").read_text())
          HOT_MODELS = {k for k, v in server_models.items() if isinstance(v, dict) and "hot" in v.get("labels", [])}
          MODEL_ALIASES = {}
          aliased_forks = set()
          for f in forks_config["forks"]:
            if f.get("model_aliases"):
              MODEL_ALIASES.update(f["model_aliases"])
              aliased_forks.add(f["fork_id"])
          for run_file in sorted(results_dir.rglob("run-*.json")):
            if "regression" in run_file.name:
              continue
            try:
              data = json.loads(run_file.read_text())
            except Exception:
              continue
            fork_id = data.get("fork_id", "unknown")
            version = data.get("fork_version", "unknown")
            hw = data.get("hardware", {}) or {}
            lem_ver = data.get("lemonade_version") or hw.get("lemonade_version")
            if lem_ver:
              lemonade_versions.add(lem_ver)
            hw_id = hw_fingerprint(hw) if hw else None
            if hw_id:
              readable = _gpu_label(hw.get("gpu"))
              ts = data.get("timestamp") or ""
              if hw_id not in systems:
                systems[hw_id] = {
                  "id": hw_id,
                  "cpu": hw.get("cpu"),
                  "gpu": readable,
                  "gpu_full": hw.get("gpu"),
                  "vram_gb": (hw.get("gpu") or [{}])[0].get("vram_gb") if hw.get("gpu") else None,
                  "ram_gb": hw.get("ram_gb"),
                  "os": hw.get("os"),
                  "lemonade_version": lem_ver,
                  "_ts": ts,
                }
              else:
                cur = systems[hw_id]
                if readable and (cur.get("gpu") or "").strip().isdigit():
                  cur["gpu"] = readable
                  cur["gpu_full"] = hw.get("gpu")
                if lem_ver and ts >= cur.get("_ts", ""):
                  cur["lemonade_version"], cur["_ts"] = lem_ver, ts
            # The bench writes a top-level "models" array (one entry per model),
            # each with its own model name + results[]. Fall back to the flat
            # top-level shape for any legacy files.
            model_entries = data.get("models")
            if not isinstance(model_entries, list):
              model_entries = [data]
            for me in model_entries:
              raw_model = me.get("model", data.get("model", "unknown"))
              if fork_id in aliased_forks and raw_model not in MODEL_ALIASES:
                continue
              model = MODEL_ALIASES.get(raw_model, raw_model)
              if model not in HOT_MODELS:
                continue
              for br in me.get("results", []):
                for sc in br.get("scenarios", []):
                  want_ctx = SCENARIO_CTX.get(sc["name"])
                  if want_ctx is None or br.get("ctx_size") not in (None, want_ctx):
                    continue
                  tps_block = sc.get("tps", {})
                  if tps_block.get("mean") is None:
                    continue
                  ttft_block = sc.get("ttft_ms", {})
                  in_tok = sc.get("input_tokens")
                  pp_tps = sc.get("pp_tps")
                  key = f"{model}|{sc['name']}"
                  entry = {
                    "model": model, "scenario": sc["name"],
                    "fork_id": fork_id, "fork_label": data.get("fork_label", fork_id),
                    "fork_repo": data.get("fork_repo", ""), "fork_version": version,
                    "backend": br.get("backend"),
                    "ctx_size": br.get("ctx_size"),
                    "quant": quant_from_checkpoint(me, data),
                    "tps_mean": round(tps_block["mean"], 2),
                    "tps_p95": round(tps_block.get("p95", 0), 2),
                    "tg_tps": round(tps_block["mean"], 2),
                    "ttft_ms_mean": round(ttft_block.get("mean", 0), 2),
                    "ttft_ms_best": round(ttft_block["min"], 2) if ttft_block.get("min") else None,
                    "pp_tps": pp_tps,
                    "input_tokens": sc.get("input_tokens"),
                    "vram_peak_gb": sc.get("vram_peak_gb"),
                    "timestamp": me.get("timestamp", data.get("timestamp")),
                    "lemonade_version": lem_ver,
                    "hw_id": hw_id,
                    "run_id": data.get("run_id"),
                    "run_url": data.get("run_url"),
                    "commit": data.get("commit"),
                  }
                  leaderboard.setdefault(key, [])
                  leaderboard[key] = [e for e in leaderboard[key] if e["fork_id"] != fork_id]
                  leaderboard[key].append(entry)
                  leaderboard[key].sort(key=lambda e: e["tps_mean"], reverse=True)

          # Per-fork build-history series (for the trend/regression chart):
          # model -> scenario -> fork_id -> [ {version, timestamp, tps, run_url} ]
          history = {}
          for run_file in sorted(results_dir.rglob("run-*.json")):
            if "regression" in run_file.name:
              continue
            try:
              data = json.loads(run_file.read_text())
            except Exception:
              continue
            fid = data.get("fork_id", "unknown")
            ver = data.get("fork_version", "unknown")
            hw = data.get("hardware", {}) or {}
            lem_ver = data.get("lemonade_version") or hw.get("lemonade_version")
            model_entries = data.get("models")
            if not isinstance(model_entries, list):
              model_entries = [data]
            for me in model_entries:
              raw_mdl = me.get("model", data.get("model", "unknown"))
              if fid in aliased_forks and raw_mdl not in MODEL_ALIASES:
                continue
              mdl = MODEL_ALIASES.get(raw_mdl, raw_mdl)
              if mdl not in HOT_MODELS:
                continue
              quant = quant_from_checkpoint(me, data)
              for br in me.get("results", []):
                for sc in br.get("scenarios", []):
                  want_ctx = SCENARIO_CTX.get(sc["name"])
                  if want_ctx is None or br.get("ctx_size") not in (None, want_ctx):
                    continue
                  tps_block = sc.get("tps", {})
                  if tps_block.get("mean") is None:
                    continue
                  ttft_block = sc.get("ttft_ms", {})
                  in_tok = sc.get("input_tokens")
                  pp_tps = sc.get("pp_tps")
                  h = history.setdefault(mdl, {}).setdefault(sc["name"], {}).setdefault(fid, [])
                  h.append({
                    "version": ver, "timestamp": me.get("timestamp", data.get("timestamp")),
                    "tps_mean": round(tps_block["mean"], 2),
                    "tps_p95": round(tps_block.get("p95", 0), 2),
                    "tg_tps": round(tps_block["mean"], 2),
                    "ttft_ms_mean": round(ttft_block.get("mean", 0), 2),
                    "ttft_ms_best": round(ttft_block["min"], 2) if ttft_block.get("min") else None,
                    "pp_tps": pp_tps,
                    "vram_peak_gb": sc.get("vram_peak_gb"),
                    "input_tokens": sc.get("input_tokens"),
                    "quant": quant,
                    "lemonade_version": lem_ver,
                    "run_id": data.get("run_id"), "run_url": data.get("run_url"),
                  })
          # sort each series chronologically and keep the last 30 points
          for mdl in history:
            for scn in history[mdl]:
              for fid in history[mdl][scn]:
                pts = sorted(history[mdl][scn][fid], key=lambda p: p.get("timestamp") or "")
                history[mdl][scn][fid] = pts[-30:]

          for _s in systems.values():
            _s.pop("_ts", None)

          def _vkey(v):
            return tuple(int(p) if p.isdigit() else -1 for p in str(v).lstrip("v").split("."))

          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo   = os.environ.get("GITHUB_REPOSITORY", "")
          latest_version = None
          latest_ts = ""
          for entries in leaderboard.values():
            for e in entries:
              ts = e.get("timestamp") or ""
              if e.get("lemonade_version") and ts >= latest_ts:
                latest_ts, latest_version = ts, e["lemonade_version"]
          if latest_version is None and lemonade_versions:
            latest_version = max(lemonade_versions, key=_vkey)
          out = {
            "generated_at": datetime.now(timezone.utc).isoformat(),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_url": f"{server}/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}" if repo else None,
            "repo": repo,
            "repo_url": f"{server}/{repo}" if repo else None,
            "actions_url": f"{server}/{repo}/actions/workflows/benchmark-regression.yml" if repo else None,
            "commit": os.environ.get("GITHUB_SHA"),
            "lemonade_version": latest_version,
            "lemonade_versions_seen": sorted(lemonade_versions, key=_vkey),
            "systems": list(systems.values()),
            "experimental_forks": experimental_forks,
            "by_model_scenario": leaderboard,
            "history": history,
          }
          Path("bench-history/leaderboard.json").write_text(json.dumps(out, indent=2))
          Path("ci/results").mkdir(parents=True, exist_ok=True)
          Path("ci/results/leaderboard.json").write_text(json.dumps(out, indent=2))
          entries = sum(len(v) for v in leaderboard.values())
          print(f"Leaderboard: {entries} entries across {len(leaderboard)} model/scenario pairs")
          print(f"History: {sum(len(s) for m in history.values() for s in m.values())} series")
          PY
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}

      # Record this run's regression alerts into the benchmark-data branch so
      # the dashboard can surface them. No GitHub issues are created (that path
      # was flaky). regressions.json is a rolling log: append this run's alerts,
      # keep the last 200. Never fails the job.
      - name: Record regressions into history branch
        run: |
          python3 - << 'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          alerts = []
          for f in Path("artifacts").rglob("regression_report.json"):
            try:
              alerts += json.loads(f.read_text()).get("alerts", [])
            except Exception:
              pass
          run_id = os.environ.get("GITHUB_RUN_ID","")
          server = os.environ.get("GITHUB_SERVER_URL","https://github.com")
          repo   = os.environ.get("GITHUB_REPOSITORY","")
          now = datetime.now(timezone.utc).isoformat()
          run_url = f"{server}/{repo}/actions/runs/{run_id}" if repo and run_id else None
          for a in alerts:
            a.setdefault("timestamp", now)
            a.setdefault("run_id", run_id)
            a.setdefault("run_url", run_url)

          log_path = Path("bench-history/regressions.json")
          log = {"generated_at": now, "regressions": []}
          if log_path.exists():
            try: log = json.loads(log_path.read_text())
            except Exception: pass
          hist = log.get("regressions", [])
          hist.extend(alerts)
          log = {"generated_at": now, "regressions": hist[-200:]}
          log_path.write_text(json.dumps(log, indent=2))
          # mirror to ci/results so it's also in the run artifact
          Path("ci/results").mkdir(parents=True, exist_ok=True)
          Path("ci/results/regressions.json").write_text(json.dumps(log, indent=2))
          crit = [a for a in alerts if a.get("severity")=="CRITICAL"]
          print(f"Recorded {len(alerts)} alert(s) this run ({len(crit)} CRITICAL); "
                f"{len(hist[-200:])} kept in benchmark-data/regressions.json")
          PY
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Push history branch
        run: |
          set -e
          git -C bench-history add -A
          if git -C bench-history commit -m "bench results + regressions (run ${{ github.run_id }})"; then
            git -C bench-history push origin "$HISTORY_BRANCH"
          else
            echo "No new results to commit"
          fi

      - name: Regression summary (non-failing)
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          crit = []
          for f in Path("artifacts").rglob("regression_report.json"):
            try:
              crit += [a for a in json.loads(f.read_text()).get("alerts", [])
                       if a.get("severity")=="CRITICAL"]
            except Exception:
              pass
          if not crit:
            print("No critical regressions this run.")
          else:
            print(f"{len(crit)} CRITICAL regression(s) recorded to benchmark-data/regressions.json:")
            for a in crit:
              print(f"  {a.get('fork_id')} / {a.get('model')} / {a.get('scenario')} "
                    f"{a.get('metric')}: {a.get('delta_pct')}%")
          # Intentionally do NOT fail the job — regressions are tracked in the
          # dashboard, not via red CI / GitHub issues.
          PY

      - name: Upload leaderboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leaderboard-${{ github.run_id }}
          path: ci/results/leaderboard.json
          retention-days: 90
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          git worktree remove --force bench-history 2>/dev/null || true
          rm -rf artifacts ci/results bench-history
