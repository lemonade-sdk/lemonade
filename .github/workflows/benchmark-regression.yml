name: Nightly Backend Perf Regression

on:
  # Nightly — catch environment drift and silent regressions
  schedule:
    - cron: '0 2 * * *'

  # On backend change — run when version pins or fork registry change
  # TEMPORARY: branch added for testing — remove iswarya/... before merge to main
  push:
    branches:
      - main
      - iswarya/issue-2858-backend-perf-tracker
    paths:
      - 'src/cpp/resources/backend_versions.json'
      - 'ci/benchmark_forks.json'
      - 'src/cpp/server/backends/**'
      - '.github/workflows/benchmark-regression.yml'

  # On release — validate perf before shipping
  release:
    types: [published]

  # On demand — investigations and PR gates
  workflow_dispatch:
    inputs:
      fork_filter:
        description: 'Comma-separated fork_ids to run (blank = all tracked)'
        required: false
        default: ''
      model_filter:
        description: 'Comma-separated model names (blank = hot models from registry)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  LEMONADE_CI_MODE: "True"
  PYTHONIOENCODING: utf-8
  HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # =========================================================================
  # Perf regression — uses lemonade already installed on self-hosted runners.
  # No build step — runners have lemonade from validate_llamacpp/vllm runs.
  # TODO: switch to downloading a release artifact once bench logic is stable.
  # =========================================================================
  bench:
    name: Bench ${{ matrix.fork_id }}
    if: always()
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows ROCm runner — mirrors validate_llamacpp.yml runner labels exactly
          - fork_id: llamacpp-rocm-nightly
            runner: [self-hosted, Windows, 128gb, rocm, lemon-prod]
            binaries_dir: C:\lemonade-bench-binaries
          - fork_id: llamacpp-rocm-stable
            runner: [self-hosted, Windows, 128gb, rocm, lemon-prod]
            binaries_dir: C:\lemonade-bench-binaries
          - fork_id: llamacpp-upstream-vulkan
            runner: [self-hosted, Windows, 128gb, vulkan, lemon-prod]
            binaries_dir: C:\lemonade-bench-binaries
          # Linux Strix Halo runner — mirrors validate_vllm.yml runner label exactly
          - fork_id: llamacpp-amd-ecosystem-gfx11
            runner: [self-hosted, stx-halo, Linux, lemon-prod]
            binaries_dir: /opt/lemonade-bench-binaries

    steps:
      # ── Windows pre-steps ────────────────────────────────────────────────
      - name: Kill stale processes (Windows)
        if: runner.os == 'Windows'
        shell: PowerShell
        run: |
          $ErrorActionPreference = "Continue"
          $patterns = @("lemonade","lemond","llama-server","llama","flm","ort-server","moonshine-server","wscript","LemonadeServer")
          foreach ($p in $patterns) {
            Get-Process | Where-Object { $_.ProcessName -like "*$p*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/checkout@v5
        with:
          clean: true

      - name: Cleanup processes (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/cleanup-processes-windows

      # ── Locate prebuilt lemonade on the runner ───────────────────────────
      - name: Locate lemonade (Windows)
        if: runner.os == 'Windows'
        shell: PowerShell
        run: |
          # Runners have lemonade installed by validate_llamacpp.yml nightly runs
          $candidates = @(
            "$env:ProgramFiles\Lemonade\lemond.exe",
            "$env:LOCALAPPDATA\lemonade_server\bin\lemond.exe",
            "C:\lemonade\lemond.exe"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          # Also try PATH
          if (-not $found) {
            $found = (Get-Command lemond -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $found) {
            Write-Host "ERROR: lemond not found on runner. Checked: $($candidates -join ', ')"
            exit 1
          }
          Write-Host "lemond: $found"
          & $found --version
          $lemonadeExe = $found -replace "lemond.exe","lemonade.exe"
          echo "LEMOND_EXE=$found" >> $env:GITHUB_ENV
          echo "LEMONADE_EXE=$lemonadeExe" >> $env:GITHUB_ENV

      - name: Locate lemonade (Linux)
        if: runner.os == 'Linux'
        run: |
          # Runners have lemonade installed by validate_vllm.yml and other CI runs
          LEMOND=$(which lemond 2>/dev/null || echo "")
          if [ -z "$LEMOND" ]; then
            echo "ERROR: lemond not found in PATH on this runner"
            exit 1
          fi
          LEMONADE=$(which lemonade 2>/dev/null || echo "")
          echo "lemond   : $LEMOND"
          echo "lemonade : $LEMONADE"
          $LEMOND --version
          echo "LEMOND_EXE=$LEMOND"   >> $GITHUB_ENV
          echo "LEMONADE_EXE=$LEMONADE" >> $GITHUB_ENV

      # ── Python venv ───────────────────────────────────────────────────────
      - name: Setup Python and venv
        uses: ./.github/actions/setup-venv
        with:
          venv-name: '.venv'
          python-version: '3.10'
          requirements-file: 'test/requirements.txt'

      # Fork binary is downloaded inside run_regression.py during the real run.
      # No separate pre-download step — lemond must be running first for registry lookup.

      # ── Start lemond — Windows (port 13305, mirrors validate_llamacpp.yml) ─
      - name: Start lemond (Windows)
        if: runner.os == 'Windows'
        shell: PowerShell
        run: |
          $cacheDir = Join-Path $PWD "ci-bench-cache-${{ matrix.fork_id }}"
          $logsDir  = Join-Path $PWD "server-logs-${{ matrix.fork_id }}"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          New-Item -ItemType Directory -Force -Path $logsDir  | Out-Null

          $proc = Start-Process `
            -FilePath "$env:LEMOND_EXE" `
            -ArgumentList @($cacheDir, "--port", "13305", "--host", "127.0.0.1") `
            -RedirectStandardOutput "$logsDir\lemond.stdout.log" `
            -RedirectStandardError  "$logsDir\lemond.stderr.log" `
            -PassThru
          Write-Host "Started lemond PID $($proc.Id)"
          echo "LEMOND_PORT=13305" >> $env:GITHUB_ENV

      # ── Start lemond — Linux (dynamic port, mirrors validate_vllm.yml exactly) ─
      - name: Start lemond (Linux)
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          CACHE_DIR="$(pwd)/ci-bench-cache-${{ matrix.fork_id }}"
          LOGS_DIR="$(pwd)/server-logs-${{ matrix.fork_id }}"
          mkdir -p "$CACHE_DIR" "$LOGS_DIR"

          pick_free_port() {
            if command -v python3 >/dev/null 2>&1; then
              python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()' && return 0
            fi
            for _ in $(seq 1 50); do
              local p=$(( (RANDOM % 20000) + 20000 ))
              if ! ss -ltn 2>/dev/null | grep -q ":$p "; then echo "$p"; return 0; fi
            done
            return 1
          }

          LEMOND_PID=""
          started=0
          for start_attempt in $(seq 1 5); do
            PORT=$(pick_free_port) || { echo "ERROR: could not find a free port"; exit 1; }
            echo "Attempt $start_attempt: starting lemond on 127.0.0.1:$PORT..."
            $LEMOND_EXE "$CACHE_DIR" --port "$PORT" --host 127.0.0.1 \
              > "$LOGS_DIR/lemond.stdout.log" 2> "$LOGS_DIR/lemond.stderr.log" &
            LEMOND_PID=$!
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$PORT/api/v1/health" > /dev/null 2>&1; then
                echo "lemond is healthy on port $PORT (PID $LEMOND_PID)"
                started=1
                break
              fi
              if ! kill -0 "$LEMOND_PID" 2>/dev/null; then
                echo "lemond (PID $LEMOND_PID) exited prematurely on port $PORT"
                cat "$LOGS_DIR/lemond.stderr.log" 2>/dev/null || true
                break
              fi
              sleep 2
            done
            [ "$started" = "1" ] && break
            echo "Start attempt $start_attempt failed; retrying on a new port..."
            kill -9 "$LEMOND_PID" 2>/dev/null || true
            sleep 1
          done
          if [ "$started" != "1" ]; then
            echo "ERROR: lemond failed to start after multiple attempts"
            exit 1
          fi
          echo "LEMOND_PID=$LEMOND_PID" >> $GITHUB_ENV
          echo "LEMOND_PORT=$PORT"      >> $GITHUB_ENV

      # ── Run regression (Windows) ─────────────────────────────────────────
      - name: Run perf regression (Windows)
        if: runner.os == 'Windows'
        shell: PowerShell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $forkFilter  = "${{ matrix.fork_id }}"
          $modelFilter = "${{ github.event.inputs.model_filter }}"
          $binariesDir = "${{ matrix.binaries_dir }}"

          $args = @(
            "ci/run_regression.py",
            "--forks",        "ci/benchmark_forks.json",
            "--output",       "ci/results",
            "--binaries-dir", $binariesDir,
            "--fork-filter",  $forkFilter,
            "--port",         "13305"
          )
          if ($modelFilter) { $args += "--model-filter"; $args += $modelFilter }

          & ".\.venv\Scripts\python.exe" @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Run regression (Linux) ────────────────────────────────────────────
      - name: Run perf regression (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODEL_FILTER="${{ github.event.inputs.model_filter }}"
          EXTRA=""
          if [ -n "$MODEL_FILTER" ]; then EXTRA="--model-filter $MODEL_FILTER"; fi

          .venv/bin/python ci/run_regression.py \
            --forks        ci/benchmark_forks.json \
            --output       ci/results \
            --binaries-dir "${{ matrix.binaries_dir }}" \
            --fork-filter  "${{ matrix.fork_id }}" \
            --port         "$LEMOND_PORT" \
            $EXTRA

      # ── Stop lemond ───────────────────────────────────────────────────────
      - name: Stop lemond (Windows)
        if: always() && runner.os == 'Windows'
        shell: PowerShell
        run: |
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:13305/internal/shutdown" -Method POST -TimeoutSec 10 | Out-Null
            Start-Sleep -Seconds 3
          } catch {}

      - name: Stop lemond (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          curl -sf -X POST "http://127.0.0.1:${LEMOND_PORT}/internal/shutdown" || true
          sleep 3
          kill $LEMOND_PID 2>/dev/null || true

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.fork_id }}-${{ github.run_id }}
          path: ci/results/
          retention-days: 90

      - name: Upload lemond logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lemond-logs-${{ matrix.fork_id }}-${{ github.run_id }}
          path: server-logs-${{ matrix.fork_id }}/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup (Windows)
        if: always() && runner.os == 'Windows'
        uses: ./.github/actions/cleanup-processes-windows

  # =========================================================================
  # Aggregate leaderboard + file issue on regression
  # =========================================================================
  report:
    name: Aggregate and report
    needs: bench
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all bench results
        uses: actions/download-artifact@v7
        with:
          pattern: bench-results-*
          merge-multiple: true
          path: ci/results

      - name: Aggregate leaderboard
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          results_dir = Path("ci/results")
          leaderboard = {}

          for run_file in sorted(results_dir.rglob("run-*.json")):
            if "regression" in run_file.name:
              continue
            try:
              data = json.loads(run_file.read_text())
            except Exception:
              continue
            fork_id  = data.get("fork_id", "unknown")
            version  = data.get("fork_version", "unknown")
            model    = data.get("model", "unknown")
            for br in data.get("results", []):
              for sc in br.get("scenarios", []):
                tps = sc.get("tps", {}).get("mean")
                if tps is None:
                  continue
                key = f"{model}|{sc['name']}"
                entry = {
                  "model": model, "scenario": sc["name"],
                  "fork_id": fork_id, "fork_label": data.get("fork_label", fork_id),
                  "fork_repo": data.get("fork_repo", ""), "fork_version": version,
                  "backend": br.get("backend"),
                  "tps_mean": round(tps, 2),
                  "ttft_ms_mean": round(sc.get("ttft_ms", {}).get("mean", 0), 2),
                  "vram_peak_gb": sc.get("vram_peak_gb"),
                }
                leaderboard.setdefault(key, [])
                leaderboard[key] = [e for e in leaderboard[key] if e["fork_id"] != fork_id]
                leaderboard[key].append(entry)
                leaderboard[key].sort(key=lambda e: e["tps_mean"], reverse=True)

          out = {"generated_at": datetime.now(timezone.utc).isoformat(),
                 "by_model_scenario": leaderboard}
          Path("ci/results/leaderboard.json").write_text(json.dumps(out, indent=2))
          entries = sum(len(v) for v in leaderboard.values())
          print(f"Leaderboard: {entries} entries across {len(leaderboard)} model/scenario pairs")
          PY

      - name: Check for critical regressions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess
          from pathlib import Path

          criticals = []
          for f in Path("ci/results").rglob("regression_report.json"):
            data = json.loads(f.read_text())
            criticals += [a for a in data.get("alerts", []) if a["severity"] == "CRITICAL"]

          if not criticals:
            print("No critical regressions.")
            raise SystemExit(0)

          lines = ["## Perf Regression Detected — Nightly Backend Bench\n"]
          lines.append("| Fork | Model | Scenario | Metric | Prev | Curr | Delta |")
          lines.append("|------|-------|----------|--------|------|------|-------|")
          for a in criticals:
            lines.append(f"| {a['fork_id']} | {a['model']} | {a['scenario']} | "
                         f"{a['metric']} | {a['prev']} | {a['curr']} | {a['delta_pct']:+.1f}% |")
          server_url = os.environ.get("GITHUB_SERVER_URL","")
          repo       = os.environ.get("GITHUB_REPOSITORY","")
          run_id     = os.environ.get("GITHUB_RUN_ID","")
          lines.append(f"\nCI run: {server_url}/{repo}/actions/runs/{run_id}")

          body  = "\n".join(lines)
          title = f"Perf regression: {', '.join(set(a['fork_id'] for a in criticals))}"
          result = subprocess.run(
            ["gh","issue","create","--title",title,"--body",body,"--label","performance,regression"],
            capture_output=True, text=True)
          print(result.stdout)
          if result.returncode != 0:
            print(result.stderr)
          raise SystemExit(1)
          PY

      - name: Upload leaderboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leaderboard-${{ github.run_id }}
          path: ci/results/leaderboard.json
          retention-days: 90
