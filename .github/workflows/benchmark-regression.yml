name: Nightly Backend Perf Regression

on:
  schedule:
    - cron: '0 2 * * *'

  # TEMPORARY: branch trigger for testing — remove before merge to main
  push:
    branches:
      - main
      - iswarya/issue-2858-backend-perf-tracker
    paths:
      - 'src/cpp/resources/backend_versions.json'
      - 'ci/benchmark_forks.json'
      - 'src/cpp/server/backends/**'
      - '.github/workflows/benchmark-regression.yml'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      fork_filter:
        description: 'Comma-separated fork_ids (blank = all tracked)'
        required: false
        default: ''
      model_filter:
        description: 'Comma-separated model names (blank = hot models from registry)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  LEMONADE_CI_MODE: "True"
  PYTHONIOENCODING: utf-8
  HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # =========================================================================
  # Get lemonade — download embeddable release package, no build needed.
  # Uses curl + GitHub API only (no gh CLI, no sudo, no cmake).
  # The embeddable package contains lemond + lemonade + resources/ — all
  # that the bench jobs need to start lemond and run lemonade bench.
  # =========================================================================
  get-lemonade:
    name: Get lemonade (embeddable)
    runs-on: ubuntu-latest
    steps:
      - name: Download lemonade embeddable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Step 1: get latest release metadata
          RELEASE=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lemonade-sdk/lemonade/releases/latest")

          VERSION=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "Latest lemonade: $VERSION"

          # Step 2: find the ubuntu embeddable asset URL
          ASSET_URL=$(echo "$RELEASE" | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; url=next((a['browser_download_url'] for a in assets if 'embeddable' in a['name'] and 'ubuntu' in a['name'] and 'x64' in a['name']),None); print(url or 'NOT_FOUND')")

          if [ "$ASSET_URL" = "NOT_FOUND" ]; then
            echo "ERROR: no ubuntu embeddable asset found. Available assets:"
            echo "$RELEASE" | python3 -c "import sys,json; [print(a['name']) for a in json.load(sys.stdin)['assets']]"
            exit 1
          fi

          echo "Downloading: $ASSET_URL"

          # Step 3: download and extract — strip top-level directory
          mkdir -p build
          curl -sfL "$ASSET_URL" | tar -xz --strip-components=1 -C build/

          # Step 4: verify required files exist
          test -f build/lemond   || { echo "ERROR: lemond missing from embeddable package"; ls -la build/; exit 1; }
          test -f build/lemonade || { echo "ERROR: lemonade missing from embeddable package"; ls -la build/; exit 1; }
          test -d build/resources || { echo "ERROR: resources/ missing — embeddable package incomplete"; ls -la build/; exit 1; }

          chmod +x build/lemond build/lemonade
          build/lemond --version
          echo "Lemonade $VERSION ready"

      - name: Upload lemonade artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-build
          path: |
            build/lemond
            build/lemonade
            build/resources/
          retention-days: 3

  # =========================================================================
  # Bench — one job per fork, mirrors validate_vllm.yml validate job exactly
  # Runner: [self-hosted, stx-halo, Linux, lemon-prod]
  # =========================================================================
  bench:
    name: Bench ${{ matrix.fork_id }}
    needs: get-lemonade
    if: always() && needs.get-lemonade.result == 'success'
    runs-on: [self-hosted, stx-halo, Linux, lemon-prod]
    strategy:
      fail-fast: false
      matrix:
        include:
          - fork_id: llamacpp-amd-ecosystem-gfx11
          - fork_id: llamacpp-rocm-nightly
          - fork_id: llamacpp-upstream-vulkan

    steps:
      - uses: actions/checkout@v5
        with:
          clean: true

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: bench-build
          path: build

      - name: Verify binaries
        run: |
          set -e
          chmod +x build/lemond build/lemonade
          build/lemond --version
          build/lemonade --version
          echo "Binaries verified!"

      - name: Setup Python and virtual environment
        uses: ./.github/actions/setup-venv
        with:
          venv-name: '.venv'
          python-version: '3.10'
          requirements-file: 'test/requirements.txt'

      - name: Download fork binary and export env var
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_ID: ${{ matrix.fork_id }}
        run: |
          set -e
          .venv/bin/python ci/run_regression.py \
            --forks        ci/benchmark_forks.json \
            --output       ci/results \
            --binaries-dir "${{ github.workspace }}/../bench-binaries" \
            --fork-filter  "$FORK_ID" \
            --download-only

          # Export the env var so lemond inherits it when it starts.
          # This is the key: LEMONADE_<RECIPE>_<BACKEND>_BIN must be set
          # in the environment BEFORE lemond starts — not just for bench client.
          .venv/bin/python - << 'PY'
          import json, os, sys
          from pathlib import Path
          forks = json.loads(Path("ci/benchmark_forks.json").read_text())["forks"]
          fork_id = os.environ["FORK_ID"]
          fork = next((f for f in forks if f["fork_id"] == fork_id), None)
          if not fork:
            print(f"ERROR: fork {fork_id} not found"); sys.exit(1)
          recipe  = fork["recipe"].upper()
          backend = fork["backend"].upper()
          exe     = fork.get("binary_exe_linux", "llama-server")
          bindir  = Path(os.environ["GITHUB_WORKSPACE"]) / ".." / "bench-binaries" / fork_id
          binary  = next(bindir.rglob(exe), None)
          if not binary:
            print(f"ERROR: {exe} not found under {bindir}"); sys.exit(1)
          env_var = f"LEMONADE_{recipe}_{backend}_BIN"
          print(f"Exporting {env_var}={binary}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"{env_var}={binary}\n")
          PY
          echo "Fork binary ready and env var exported"

      - name: Run validation with lemond
        env:
          HOME: ${{ github.workspace }}/.home
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p "$HOME"
          echo "HOME=$HOME" >> "$GITHUB_ENV"

          FORK_ID="${{ matrix.fork_id }}"
          # TEMPORARY: single model for CI validation — remove when bench is confirmed working
          MODEL_FILTER="Qwen3.6-35B-A3B-GGUF"
          CACHE_DIR="$RUNNER_TEMP/lemond-bench-cache-$FORK_ID"
          LOGS_DIR="$(pwd)/server-logs-$FORK_ID"
          mkdir -p "$CACHE_DIR" "$LOGS_DIR"
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"

          pick_free_port() {
            if command -v python3 >/dev/null 2>&1; then
              python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()' && return 0
            fi
            for _ in $(seq 1 50); do
              local p=$(( (RANDOM % 20000) + 20000 ))
              if ! ss -ltn 2>/dev/null | grep -q ":$p "; then echo "$p"; return 0; fi
            done
            return 1
          }

          # lemond inherits LEMONADE_<RECIPE>_<BACKEND>_BIN from GITHUB_ENV
          # (set in the previous step) — this is what routes to the fork binary
          LEMOND_PID=""
          started=0
          for start_attempt in $(seq 1 5); do
            PORT=$(pick_free_port) || { echo "ERROR: could not find a free port"; exit 1; }
            echo "Attempt $start_attempt: starting lemond on 127.0.0.1:$PORT..."
            build/lemond "$CACHE_DIR" --port "$PORT" --host 127.0.0.1 \
              > "$LOGS_DIR/lemond.stdout.log" 2> "$LOGS_DIR/lemond.stderr.log" &
            LEMOND_PID=$!
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$PORT/api/v1/health" > /dev/null 2>&1; then
                echo "lemond is healthy on port $PORT (PID $LEMOND_PID)"
                started=1
                break
              fi
              if ! kill -0 "$LEMOND_PID" 2>/dev/null; then
                echo "lemond (PID $LEMOND_PID) exited prematurely on port $PORT"
                cat "$LOGS_DIR/lemond.stderr.log" 2>/dev/null || true
                break
              fi
              sleep 2
            done
            [ "$started" = "1" ] && break
            echo "Start attempt $start_attempt failed; retrying on a new port..."
            kill -9 "$LEMOND_PID" 2>/dev/null || true
            sleep 1
          done
          if [ "$started" != "1" ]; then
            echo "ERROR: lemond failed to start after multiple attempts"
            cat "$LOGS_DIR/lemond.stderr.log" 2>/dev/null || true
            exit 1
          fi

          EXIT_CODE=0
          BENCH_ARGS=(
            ci/run_regression.py
            --forks        ci/benchmark_forks.json
            --output       ci/results
            --binaries-dir "${{ github.workspace }}/../bench-binaries"
            --fork-filter  "$FORK_ID"
            --port         "$PORT"
          )
          if [ -n "$MODEL_FILTER" ]; then
            BENCH_ARGS+=(--model-filter "$MODEL_FILTER")
          fi

          LEMONADE_EXE="$(pwd)/build/lemonade" .venv/bin/python "${BENCH_ARGS[@]}" || EXIT_CODE=$?

          curl -sf -X POST "http://127.0.0.1:$PORT/internal/shutdown" || true
          sleep 2
          kill "$LEMOND_PID" 2>/dev/null || true

          exit $EXIT_CODE

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.fork_id }}-${{ github.run_id }}
          path: ci/results/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload lemond logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lemond-logs-${{ matrix.fork_id }}-${{ github.run_id }}
          path: server-logs-${{ matrix.fork_id }}/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          pkill -9 -f lemond 2>/dev/null || true

  # =========================================================================
  # Report — aggregates leaderboard, files issue on critical regression
  # =========================================================================
  report:
    name: Aggregate and report
    needs: bench
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all bench results
        uses: actions/download-artifact@v7
        with:
          pattern: bench-results-*
          merge-multiple: true
          path: ci/results

      - name: Aggregate leaderboard
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          results_dir = Path("ci/results")
          leaderboard = {}

          for run_file in sorted(results_dir.rglob("run-*.json")):
            if "regression" in run_file.name:
              continue
            try:
              data = json.loads(run_file.read_text())
            except Exception:
              continue
            fork_id = data.get("fork_id", "unknown")
            version = data.get("fork_version", "unknown")
            model   = data.get("model", "unknown")
            for br in data.get("results", []):
              for sc in br.get("scenarios", []):
                tps = sc.get("tps", {}).get("mean")
                if tps is None:
                  continue
                key = f"{model}|{sc['name']}"
                entry = {
                  "model": model, "scenario": sc["name"],
                  "fork_id": fork_id, "fork_label": data.get("fork_label", fork_id),
                  "fork_repo": data.get("fork_repo", ""), "fork_version": version,
                  "backend": br.get("backend"),
                  "tps_mean": round(tps, 2),
                  "ttft_ms_mean": round(sc.get("ttft_ms", {}).get("mean", 0), 2),
                  "vram_peak_gb": sc.get("vram_peak_gb"),
                }
                leaderboard.setdefault(key, [])
                leaderboard[key] = [e for e in leaderboard[key] if e["fork_id"] != fork_id]
                leaderboard[key].append(entry)
                leaderboard[key].sort(key=lambda e: e["tps_mean"], reverse=True)

          out = {"generated_at": datetime.now(timezone.utc).isoformat(),
                 "by_model_scenario": leaderboard}
          Path("ci/results/leaderboard.json").write_text(json.dumps(out, indent=2))
          entries = sum(len(v) for v in leaderboard.values())
          print(f"Leaderboard: {entries} entries across {len(leaderboard)} model/scenario pairs")
          PY

      - name: Check for critical regressions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess
          from pathlib import Path

          criticals = []
          for f in Path("ci/results").rglob("regression_report.json"):
            data = json.loads(f.read_text())
            criticals += [a for a in data.get("alerts", []) if a["severity"] == "CRITICAL"]

          if not criticals:
            print("No critical regressions.")
            raise SystemExit(0)

          lines = ["## Perf Regression Detected\n"]
          lines.append("| Fork | Model | Scenario | Metric | Prev | Curr | Delta |")
          lines.append("|------|-------|----------|--------|------|------|-------|")
          for a in criticals:
            lines.append(f"| {a['fork_id']} | {a['model']} | {a['scenario']} | "
                         f"{a['metric']} | {a['prev']} | {a['curr']} | {a['delta_pct']:+.1f}% |")
          server_url = os.environ.get("GITHUB_SERVER_URL","")
          repo = os.environ.get("GITHUB_REPOSITORY","")
          run_id = os.environ.get("GITHUB_RUN_ID","")
          lines.append(f"\nCI run: {server_url}/{repo}/actions/runs/{run_id}")

          body = "\n".join(lines)
          title = f"Perf regression: {', '.join(set(a['fork_id'] for a in criticals))}"
          result = subprocess.run(
            ["gh", "issue", "create", "--title", title, "--body", body,
             "--label", "performance,regression"],
            capture_output=True, text=True)
          print(result.stdout)
          if result.returncode != 0:
            print(result.stderr)
          raise SystemExit(1)
          PY

      - name: Upload leaderboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leaderboard-${{ github.run_id }}
          path: ci/results/leaderboard.json
          retention-days: 90
          if-no-files-found: warn
