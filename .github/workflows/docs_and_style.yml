name: Docs And Style
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:

  app-regression-tests:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-app-regression-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - name: Install app dependencies
        working-directory: src/app
        run: npm ci
      - name: Type-check application (same strictness as the production Webpack build)
        working-directory: src/app
        run: npm run typecheck
      - name: Run app regression tests
        run: node test/app/run-app-regression-tests.cjs

  tauri-compile-check:
    name: Compile-check the Tauri host (${{ matrix.os }})
    # The Tauri host is Rust, which `npm run typecheck` does not touch. Both
    # jobs that build it — the Windows desktop installer and the macOS .dmg —
    # defer to the merge queue, so without this a broken src-tauri compiles
    # nowhere until a PR is already queued.
    #
    # Windows is not optional here: webview_shim.rs and lib.rs gate code behind
    # cfg(target_os = "windows"), and webview2-com/windows are Windows-only
    # dependencies, so a Linux-only check would miss exactly the code whose
    # packaging job was deferred. cargo check rather than a full build — this
    # is a compile canary, not a packaging step.
    #
    # Deliberately uncached: a cold check measures ~1.5 min, and the Actions
    # cache is a 10 GB LRU pool shared with the FetchContent caches the Windows
    # installer jobs restore from.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    concurrency:
      group: ${{ github.workflow }}-tauri-check-${{ matrix.os }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Compile-check the Tauri host
        working-directory: src/app/src-tauri
        run: cargo check --locked --all-targets

  backend-docs-drift:
    # The backend reference doc (docs/dev/backends-reference.md) is generated from
    # the self-describing backend descriptors. Build lemond, regenerate, and fail
    # if the committed doc is stale — the same guarantee a lint provides.
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-backend-docs-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-backend-drift-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-backend-drift-${{ hashFiles('CMakeLists.txt') }}-
            ccache-backend-drift-
      - name: Configure and install build dependencies
        run: ./setup.sh
      - name: Build lemond
        run: cmake --build --preset default --target lemond
      - name: Check backend reference docs are up to date
        run: python3 docs/tools/gen_backend_boilerplate.py --check

  markdown-link-check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check
      - name: Check Markdown links
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name "*.md" -not -path "./node_modules/*" -print0 | \
            xargs -0 -P 4 -n 1 markdown-link-check -c .github/workflows/mlc_config.json
