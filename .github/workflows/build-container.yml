name: Publish Containers

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:
  # Build (but do not publish) on PRs that change how the image is built. The
  # nightly schedule is otherwise the first thing to exercise a change, against
  # the tag every Linux CI job and every PPA job pulls. Deliberately narrow: a
  # C++ change cannot break the image in a way `Build Lemonade .deb Package`
  # does not already catch on the same PR.
  pull_request:
    paths:
      - .ubuntu/Dockerfile
      - .dockerignore
      - contrib/debian/**
      - .github/workflows/build-container.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-container:
    name: Build build-environment (ubuntu${{ matrix.ubuntu_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # prime_ccache belongs to the tag whose compile CI actually gates:
          # build-lemonade-deb runs in this image on every PR and merge, so a
          # break in the primed build is caught before it can strand the
          # nightly publish. See .ubuntu/Dockerfile.
          - ubuntu_version: "24.04"
            ubuntu_ppa: "ppa:lemonade-team/bleeding-edge"
            prime_ccache: "true"
          - ubuntu_version: "25.10"
            ubuntu_ppa: "ppa:lemonade-team/bleeding-edge"
            prime_ccache: ""
          - ubuntu_version: "26.04"
            ubuntu_ppa: ""
            prime_ccache: ""

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Only the publish path needs arm64, and emulating it on a PR would cost
      # far more than the Dockerfile change being verified.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lemonade-sdk/lemonade/build-environment
          tags: |
            type=raw,value=ubuntu${{ matrix.ubuntu_version }}
            type=raw,value=latest,enable=${{ matrix.ubuntu_version == '26.04' }}
            type=raw,value=nightly,enable=${{ matrix.ubuntu_version == '26.04' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .ubuntu/Dockerfile
          build-args: |
            BASE_IMAGE=ubuntu:${{ matrix.ubuntu_version }}
            UBUNTU_PPA=${{ matrix.ubuntu_ppa }}
            PRIME_CCACHE=${{ matrix.prime_ccache }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'lemonade-build-environment:test' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No buildx layer cache on purpose. This workflow is not latency
          # sensitive — nightly publishes and the occasional PR that changes how
          # the image is built — while the Actions cache is a 10 GB LRU pool
          # shared with the FetchContent caches the Windows installer jobs
          # restore from. Retaining a ~300 MB primed-ccache layer per Ubuntu
          # release would evict the caches that are on the critical path.

      - name: Verify the compiler cache was primed
        # Runs on the publish path too, against the tag that was just pushed:
        # a prime that silently produces nothing would otherwise reach every
        # Linux CI job and every PPA job, with a slow .deb build as the only
        # symptom. The runner is amd64, so this pulls the amd64 manifest — the
        # same one the prime targets.
        if: matrix.prime_ccache == 'true'
        shell: bash
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'lemonade-build-environment:test' || format('ghcr.io/lemonade-sdk/lemonade/build-environment:ubuntu{0}', matrix.ubuntu_version) }}
        run: |
          set -euo pipefail

          # An empty cache means the prime silently produced nothing, which
          # would leave every .deb build compiling from scratch again. Measured
          # on the directory rather than `ccache -s` output, which is not a
          # stable parsing target across ccache versions. The upper bound is
          # ccache's own -M setting, so only the floor needs asserting here.
          docker run --rm "$IMAGE" ccache -s

          debugpath="$(docker run --rm "$IMAGE" cat /opt/ccache-debugpath)"
          echo "Recorded DEB_BUILD_DEBUGPATH: ${debugpath}"

          size_mb="$(docker run --rm "$IMAGE" sh -c 'du -sm "$CCACHE_DIR"' | cut -f1)"
          echo "Primed ccache size: ${size_mb} MB"
          if [ "$size_mb" -lt 50 ]; then
            echo "ERROR: the primed ccache is essentially empty"
            exit 1
          fi
