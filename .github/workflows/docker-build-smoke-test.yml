name: Docker Build Smoke Test

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "src/cpp/**"
      - "include/**"
      - "resources/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "setup.sh"
      - ".github/workflows/docker-build-smoke-test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t lemonade:test .

      - name: Run container
        run: |
          docker run -d \
            --name lemonade-test \
            -p 13305:13305 \
            lemonade:test

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Lemonade to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:13305/live > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          docker logs lemonade-test
          exit 1

      - name: CLI on PATH regression check
        run: |
          # Regression guard: the lemonade/lemond binaries must be callable by
          # name via `docker exec` (i.e. on PATH), not just by absolute path.
          docker exec lemonade-test sh -lc 'command -v lemonade && command -v lemond'
          docker exec lemonade-test sh -lc 'lemonade status'

      - name: Unprivileged process + device group injection check
        run: |
          # The entrypoint runs as root, maps host device groups onto the
          # lemonade user, then drops privileges. Verify the server process
          # ends up as UID 10001 with an injected supplementary device group.
          FAKE_GID=64200
          mkdir -p /tmp/fakedri
          : > /tmp/fakedri/renderD128
          sudo chown 0:${FAKE_GID} /tmp/fakedri/renderD128

          docker run -d --name lemonade-perms \
            -v /tmp/fakedri/renderD128:/dev/dri/renderD128 \
            lemonade:test

          for i in {1..30}; do
            if docker exec lemonade-perms sh -c 'test -r /proc/1/status'; then
              break
            fi
            sleep 1
          done

          UID_LINE=$(docker exec lemonade-perms grep '^Uid:' /proc/1/status)
          echo "$UID_LINE"
          echo "$UID_LINE" | awk '{ exit ($2 == 10001) ? 0 : 1 }'

          GROUPS_LINE=$(docker exec lemonade-perms grep '^Groups:' /proc/1/status)
          echo "$GROUPS_LINE"
          echo "$GROUPS_LINE" | tr ' \t' '\n' | grep -qx "${FAKE_GID}"

          docker rm -f lemonade-perms

      - name: Load model
        run: |
          curl -X POST http://localhost:13305/api/v1/load \
            -H "Content-Type: application/json" \
            -d '{"model_name": "Qwen3-0.6B-GGUF"}'

      - name: Chat completion smoke test
        run: |
          RESPONSE=$(curl -s http://localhost:13305/api/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "Qwen3-0.6B-GGUF",
              "messages": [
                { "role": "user", "content": "Hello, Lemonade!" }
              ]
            }')

          echo "Response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"choices"' || exit 1

      - name: Cleanup
        if: always()
        run: |
          docker logs lemonade-test || true
          docker rm -f lemonade-test || true
          docker logs lemonade-perms || true
          docker rm -f lemonade-perms || true
