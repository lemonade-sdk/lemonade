name: Repo Manager

on:
  push:
    branches:
      - main

# A group per pushed commit, so pushes do not cancel each other's reviews. Whatever is
# missed here is reviewed during the release build instead, where it delays the release.
concurrency:
  group: repo-manager-main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  packages: read
  pull-requests: read

jobs:
  list-commits:
    name: List the commits this push added
    runs-on: ubuntu-latest
    outputs:
      shas: ${{ steps.list.outputs.shas }}
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0

      - name: List the commits
        id: list
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # After a force-push, and on a branch's first push, `before` is not an ancestor.
          if git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            # lemonade squash-merges, so a merge commit here carries no change of its own.
            shas=$(git rev-list --reverse --no-merges "$BEFORE..$AFTER")
          else
            shas="$AFTER"
          fi
          json=$(printf '%s\n' "$shas" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "shas=$json" >> "$GITHUB_OUTPUT"
          echo "Reviewing $(jq length <<<"$json") commit(s): $json"

  review:
    name: Review ${{ matrix.sha }}
    needs: list-commits
    if: needs.list-commits.outputs.shas != '[]'
    runs-on: [self-hosted, stx-halo, Linux, X64, lemon-prod]
    timeout-minutes: 120
    container:
      image: ghcr.io/lemonade-sdk/lemonade/repo-manager:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # /dev/dri is what keeps the model on the iGPU instead of the CPU.
      options: --device /dev/dri
      # The model is 23GB, so it stays on the machine between jobs rather than in the
      # image. Docker creates this on first use; nothing else on the machine writes it.
      volumes:
        - /var/cache/lemonade-ci/repo-manager:/cache
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.list-commits.outputs.shas) }}
    steps:
      # Enough to resolve the local action; it does its own clone.
      - uses: actions/checkout@v5
        with:
          clean: true
          sparse-checkout: .github

      - uses: ./.github/actions/repo-manager
        with:
          command: commit review ${{ matrix.sha }}
          app-client-id: ${{ vars.RELEASE_BRANCH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_BRANCH_APP_PRIVATE_KEY }}
