name: Routing Schema Tests
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  classify-small-docs-pr:
    name: Classify small docs PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/classify-small-docs-pr
      - name: Classify changed files
        id: classify
        uses: ./.github/actions/classify-small-docs-pr
        with:
          max-files: "5"

  full-ci-gate:
    name: Full CI gate
    needs: classify-small-docs-pr
    if: >-
      !cancelled() &&
      (needs.classify-small-docs-pr.result != 'success' ||
       needs.classify-small-docs-pr.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.classify-small-docs-pr.outputs.reason }}"

  routing-schema-tests:
    name: Routing schema + fixtures
    needs: full-ci-gate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema
      # Pure-python, no server binary needed — fast PR gate for the routing
      # policy/decision schemas. Keeps the back-compat guardrails enforced.
      - name: Validate fixtures against the JSON schemas
        run: python test/test_routing_fixtures.py
      - name: Verify frozen-major schema lock
        run: python test/test_schema_lock.py
