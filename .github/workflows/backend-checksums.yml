# backend_source=modelscope installs a file only when backend_versions.json pins
# its SHA-256, so a pin change must come with its checksums. Fix a failure with
# `python tools/modelscope_mirror/modelscope_mirror.py --write-checksums`.
name: Backend checksums

on:
  pull_request:
    paths:
      - src/cpp/resources/backend_versions.json
      - tools/modelscope_mirror/**
      - .github/workflows/backend-checksums.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the mirror tool
        run: python tools/modelscope_mirror/test_modelscope_mirror.py -v
      - name: Check pinned checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/modelscope_mirror/modelscope_mirror.py --check-checksums
