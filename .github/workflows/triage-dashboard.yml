name: Triage dashboard

# Publishes the triage dashboard to a SEPARATE repo's GitHub Pages
# (lemonade-sdk/lemonade-triage -> https://lemonade-sdk.github.io/lemonade-triage/)
# rather than this repo's Pages. This repo's Pages serves the production
# lemonade-server.ai site from the `website` branch (deploy-from-branch) and is
# only meant to refresh at release boundaries, so the dashboard must never
# touch it.
#
# Pipeline per run:
#   1. auto_assign.py  — scores open PRs by diff history, writes reviewer
#      suggestions to _site/suggestions.json (dry-run; nothing is posted).
#   2. triage_maintainer.py — generates maintainer.html, consuming the
#      suggestions file for the "Suggested reviewer" chip and filter, and
#      fetching RFCs + weekly pulse data.
#   3. triage_dashboard.py — generates index.html (community-facing view).
#
# One-time setup (admin):
#   1. lemonade-sdk/lemonade-triage exists with Pages set to "Deploy from a
#      branch", Branch = main / (root).
#   2. Add TRIAGE_DASHBOARD_TOKEN (fine-grained PAT, contents:write on
#      lemonade-sdk/lemonade-triage) to THIS repo's secrets.
#   3. Optionally add TRIAGE_TOKEN (PAT with read:org + repo) to allow
#      auto_assign.py to list collaborators. Falls back to GITHUB_TOKEN.
#   4. Set repo variable AUTO_ASSIGN_APPLY=true to enable reviewer requests
#      from the daily auto-label run (off by default).

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/triage_dashboard.py"
      - ".github/scripts/triage_maintainer.py"
      - ".github/scripts/auto_assign.py"
      - ".github/scripts/test_triage_dashboard.py"
      - ".github/workflows/triage-dashboard.yml"

# Only one publish run at a time — concurrent pushes to lemonade-triage
# race on the expected SHA and fail. Queue; never cancel in progress.
concurrency:
  group: triage-dashboard-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      discussions: read
    env:
      # Prefer TRIAGE_TOKEN for collaborator listing; fall back to default.
      GH_TOKEN: ${{ secrets.TRIAGE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by auto_assign.py for file-level blame scoring.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dashboard tests
        run: python .github/scripts/test_triage_dashboard.py

      - name: Score reviewer suggestions (dry-run)
        # Writes _site/suggestions.json — not applied to GitHub, just fed to
        # the maintainer dashboard so the "Suggested reviewer" chip is live.
        run: |
          mkdir -p _site
          python .github/scripts/auto_assign.py \
            --repo "${{ github.repository }}" \
            --json _site/suggestions.json

      - name: Generate maintainer dashboard
        # Consumes suggestions.json, fetches RFCs, builds weekly pulse.
        run: |
          python .github/scripts/triage_maintainer.py \
            --repo "${{ github.repository }}" \
            --reviewer-suggestions _site/suggestions.json \
            --include-rfcs \
            --output _site/maintainer.html

      - name: Generate community dashboard
        run: |
          python .github/scripts/triage_dashboard.py \
            --repo "${{ github.repository }}" \
            --output _site/index.html

      - name: Publish to triage dashboard repo
        env:
          DEPLOY_TOKEN: ${{ secrets.TRIAGE_DASHBOARD_TOKEN }}
        run: |
          cd _site
          git init -q
          git checkout -q -b main
          git add .
          git -c user.name="Lemonade Bot" -c user.email="lemonade@amd.com" \
            commit -q -m "Update triage dashboard"
          git push -f -q \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/lemonade-sdk/lemonade-triage.git" \
            main
