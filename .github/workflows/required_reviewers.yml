# Assert that a PR has the reviewers it requires before it can be queued.
#
# A *primary* review comes from the maintainer of a vertical, a function of
# the repo that lives in known folders. A PR needs one for every vertical it
# touches:
#
#   CLI              src/cpp/cli/**  -> @bitgamma
#   GUI              src/app/**      -> @kpoineal
#   Everything else  anything else   -> @jeremyfowers or @ramkrishna2910
#
# An *expert* review comes from the maintainer of a horizontal, a function
# that cuts across folders, recognized by the words the diff and the PR body
# use. These are additive; an expert review never stands in for a primary one:
#
#   Networking & security  curl / tcp / udp / cors / security -> @Geramy
#   ROCm                   rocm                                      -> @superm1
#
# A reviewer counts as satisfied when they authored the PR or approved its
# current head commit. A push after an approval invalidates that approval.
# The reviewer lists and the analysis live in
# .github/scripts/check_maintainer_involvement.py.
#
# This policy is temporary. It enforces the partial code freeze ahead of the
# v11.9.1 release, and is expected to loosen as more primary and expert
# reviewers are named. See discussion #3421.
#
# To enforce, add "required-reviewers" to the branch protection required status
# checks. Without that this workflow only reports.
name: Required Reviewers

on:
  # pull_request_target so the job reads the PR through the API with the base
  # repo's token; no PR code is checked out or executed.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  # Re-run when an approval lands, is dismissed, or changes, so the check
  # reflects the current review state.
  pull_request_review:
    types: [submitted, dismissed, edited]
  # Required checks are evaluated against the merge group, and the group ref
  # names the PR, so the queue re-runs the same check against it.
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate"
        required: true
        type: string

permissions:
  contents: read
  # write so the check can keep one comment on the PR up to date.
  pull-requests: write

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    # The field is absent on merge_group and workflow_dispatch, where the
    # comparison is still true and the job runs.
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/test_maintainer_involvement.py

  required-reviewers:
    runs-on: ubuntu-latest
    needs: logic-tests
    if: github.event.pull_request.draft != true
    concurrency:
      group: >-
        required-reviewers-${{ github.event.pull_request.number
        || github.event.merge_group.head_ref || inputs.pr }}
      cancel-in-progress: ${{ github.event_name != 'merge_group' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required reviewers
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ] && [ -n "$MERGE_GROUP_REF" ]; then
            # refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>
            PR_NUMBER=$(printf '%s' "$MERGE_GROUP_REF" \
              | sed -n 's|.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p')
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a PR number (event: ${{ github.event_name }})"
            exit 1
          fi
          # A merge_group run re-verifies the PR the queue named; the comment
          # belongs to the PR event.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            python .github/scripts/check_maintainer_involvement.py "$PR_NUMBER"
          else
            python .github/scripts/check_maintainer_involvement.py "$PR_NUMBER" --comment
          fi
