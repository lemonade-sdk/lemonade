# The policy, the reviewer lists, and what counts as an approval are all
# defined in .github/scripts/check_maintainer_involvement.py.
name: Required Reviewers

on:
  # pull_request_target so the job reads the PR through the API with the base
  # repo's token; no PR code is checked out or executed.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]
  # Required checks are evaluated against the merge group, not the PR.
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate"
        required: true
        type: string

permissions:
  contents: read
  # write so the check can keep one comment on the PR up to date.
  pull-requests: write

jobs:
  required-reviewers:
    runs-on: ubuntu-latest
    # The field is absent on merge_group and workflow_dispatch, where the
    # comparison is still true and the job runs.
    if: github.event.pull_request.draft != true
    concurrency:
      group: >-
        required-reviewers-${{ github.event.pull_request.number
        || github.event.merge_group.head_ref || inputs.pr }}
      cancel-in-progress: ${{ github.event_name != 'merge_group' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The default ref on pull_request_review and merge_group carries the PR's
      # own changes; the policy has to come from the base branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required reviewers
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ] && [ -n "$MERGE_GROUP_REF" ]; then
            # refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>
            PR_NUMBER=$(printf '%s' "$MERGE_GROUP_REF" \
              | sed -n 's|.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p')
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a PR number (event: ${{ github.event_name }})"
            exit 1
          fi
          # The comment belongs to the PR event, not to the queue re-run.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            python .github/scripts/check_maintainer_involvement.py "$PR_NUMBER"
          else
            python .github/scripts/check_maintainer_involvement.py "$PR_NUMBER" --comment
          fi
