# Assert that a PR has the reviewers it requires before it can be queued.
#
# A *primary* review comes from the maintainer of a vertical — a function of
# the repo that lives in known folders. A PR needs one for every vertical it
# touches:
#
#   CLI              src/cpp/cli/**  -> @bitgamma
#   GUI              src/app/**      -> @kpoineal
#   Everything else  anything else   -> @jeremyfowers or @ramkrishna2910
#
# An *expert* review comes from the maintainer of a horizontal — a function
# that cuts across folders, recognized by the words the diff uses. These are
# additive; an expert review never stands in for a primary one:
#
#   Networking  diff mentions http / curl / tcp / udp / cors -> @Geramy
#   ROCm        diff mentions rocm                           -> @superm1
#
# A reviewer counts as satisfied when they authored the PR or approved it.
# The reviewer lists and the analysis live in
# .github/scripts/check_maintainer_involvement.py.
#
# This policy is temporary — it enforces the partial code freeze ahead of the
# v11.9.1 release, and is expected to loosen as more primary and expert
# reviewers are named. See discussion #3421.
#
# To enforce, add "required-reviewers" to the branch protection required status
# checks. Without that this workflow only reports.
name: Required Reviewers

on:
  # pull_request_target so the job reads the PR through the API with the base
  # repo's token; no PR code is checked out or executed.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  # Re-run when an approval lands, dismissed, or changes, so the check reflects
  # the current review state rather than the state at push time.
  pull_request_review:
    types: [submitted, dismissed, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/test_maintainer_involvement.py

  required-reviewers:
    runs-on: ubuntu-latest
    needs: logic-tests
    concurrency:
      group: required-reviewers-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required reviewers
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a PR number (got: $PR_NUMBER)"
            exit 1
          fi
          python .github/scripts/check_maintainer_involvement.py "$PR_NUMBER"
