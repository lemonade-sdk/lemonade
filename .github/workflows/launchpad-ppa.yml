name: Launchpad PPA

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-matrix:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      package_matrix: ${{ steps.set-matrix.outputs.package_matrix }}
    steps:
      - name: Define shared matrix values
        id: set-matrix
        run: |
          {
            echo 'package_matrix<<EOF'
            cat <<'JSON'
          {
            "include": [
              {
                "release": "24.04",
                "distro": "ubuntu",
                "codename": "noble",
                "ppa": "ppa:lemonade-team/bleeding-edge"
              },
              {
                "release": "26.04",
                "distro": "ubuntu",
                "codename": "resolute",
                "ppa": ""
              }
            ]
          }
          JSON
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build
    needs: prepare-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Label a PR `ci:distros` to opt it back in.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:distros')
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.package_matrix) }}
    container:
      image: ghcr.io/lemonade-sdk/lemonade/build-environment:${{ matrix.distro }}${{ matrix.release }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Prepare Debian build
        id: get_version
        uses: ./.github/actions/prepare-debian-build
        with:
          release: ${{ matrix.release }}
          codename: ${{ matrix.codename }}

      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Catch missing build-deps
        run: |
          apt-get update && apt-get build-dep . -y

      - name: Build binary package
        id: build_binary
        # Also on a labelled PR: the label has to reproduce what the queue runs,
        # and a source-only package compiles nothing.
        if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:distros')
        uses: ./.github/actions/build-debian-package
        with:
          package-type: binary
          deb-version: ${{ steps.get_version.outputs.version }}

      - name: Build source package
        id: build_source
        if: github.event_name != 'merge_group' && !contains(github.event.pull_request.labels.*.name, 'ci:distros')
        uses: ./.github/actions/build-debian-package
        with:
          package-type: source
          deb-version: ${{ steps.get_version.outputs.version }}

      - name: Upload Debian package
        if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:distros')
        uses: actions/upload-artifact@v7
        with:
          name: lemonade-${{ matrix.codename }}-deb
          path: ${{ steps.build_binary.outputs.output-dir }}/*.deb
          retention-days: 30

      - name: Upload source package
        if: github.event_name != 'merge_group' && !contains(github.event.pull_request.labels.*.name, 'ci:distros')
        uses: actions/upload-artifact@v7
        with:
          name: lemonade-${{ matrix.codename }}-source-package
          path: ${{ steps.build_source.outputs.output-dir }}/*
          retention-days: 30

  package-arm64:
    name: Build (ARM64)
    # Uses official ubuntu:${{ matrix.release }} images from Docker Hub instead of
    # the custom build-environment images, because the latter do not yet carry
    # linux/arm64 manifests. build-container.yml will publish multi-arch images
    # post-merge; once that happens this can revert to the custom build-environment.
    needs: prepare-matrix
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    # Label a PR `ci:distros` to opt it back in.
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:distros')
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.package_matrix) }}
    container:
      image: ubuntu:${{ matrix.release }}
    steps:
      - name: Install checkout prerequisites
        run: |
          set -e
          # The Ubuntu ports mirror occasionally serves a package index that
          # is briefly out of sync with its pool (esp. on arm64 runners),
          # causing 404s on individual .deb files. Retry a few times.
          success=false
          for i in 1 2 3; do
            if apt-get update && \
                apt-get install -y git ca-certificates software-properties-common; then
              success=true
              break
            fi
            echo "apt-get failed (attempt $i/3), retrying..."
            sleep 10
          done
          $success

      - name: Add PPA for build dependencies
        if: matrix.ppa != ''
        run: add-apt-repository -y ${{ matrix.ppa }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Install build dependencies
        run: |
          set -e
          # The Ubuntu ports mirror occasionally serves a package index that
          # is briefly out of sync with its pool (esp. on arm64 runners),
          # causing 404s on individual .deb files. Retry a few times.
          success=false
          for i in 1 2 3; do
            if apt-get update && \
                apt-get install -y \
                  build-essential \
                  curl \
                  debhelper \
                  devscripts \
                  dpkg-dev \
                  git \
                  python3-pip \
                  python3-venv \
                  unzip; then
              success=true
              break
            fi
            echo "apt-get failed (attempt $i/3), retrying..."
            sleep 10
          done
          $success

      - name: Prepare Debian build
        id: get_version
        uses: ./.github/actions/prepare-debian-build
        with:
          release: ${{ matrix.release }}
          codename: ${{ matrix.codename }}

      - name: Build binary package
        id: build_binary
        uses: ./.github/actions/build-debian-package
        with:
          package-type: binary
          deb-version: ${{ steps.get_version.outputs.version }}
          arch-only: 'true'

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: lemonade-${{ matrix.codename }}-arm64-deb
          path: ${{ steps.build_binary.outputs.output-dir }}/*.deb
          retention-days: 30

  upgrade-test:
    name: Upgrade test (${{ matrix.codename }})
    needs: [prepare-matrix, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Needs the binary .deb, which only builds in the merge queue or on a
    # ci:distros-labelled PR (see the `package` job's build steps).
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:distros')
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "26.04"
            codename: resolute
    container:
      image: ghcr.io/lemonade-sdk/lemonade/build-environment:ubuntu${{ matrix.release }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Download new build (.deb)
        uses: actions/download-artifact@v7
        with:
          name: lemonade-${{ matrix.codename }}-deb
          path: new-deb

      - name: Install prerequisites
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl procps software-properties-common util-linux

      - name: Install last stable from PPA
        id: stable
        shell: bash
        run: |
          set -e
          add-apt-repository -y ppa:lemonade-team/stable
          apt-get update
          # Skip gracefully on releases the stable PPA does not build for yet
          # (e.g. a brand-new Ubuntu). Nothing to upgrade from → nothing to test.
          cand=$(apt-cache policy lemonade-server | awk '/Candidate:/ {print $2}')
          if [ -z "$cand" ] || [ "$cand" = "(none)" ]; then
            echo "No stable lemonade-server candidate for ${{ matrix.codename }}; skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apt-get install -y lemonade-server
          echo "Installed stable version: $(dpkg-query -W -f='${Version}' lemonade-server)"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Start stable lemond
        if: steps.stable.outputs.skipped != 'true'
        uses: ./.github/actions/start-lemond-service
        with:
          port: '13305'
          log-name: 'lemonade-server-stable.log'

      - name: Seed config and download a model
        if: steps.stable.outputs.skipped != 'true'
        shell: bash
        run: |
          set -e
          # Persist a benign, non-default config value (does not affect binding).
          lemonade config set log_level=debug

          # Download the purpose-built tiny CI model, retrying transient HF errors.
          ok=false
          for a in 1 2 3; do
            if lemonade pull Tiny-Test-Model-GGUF; then ok=true; break; fi
            echo "pull attempt $a failed; retrying..."; sleep 10
          done
          $ok

          echo "=== baseline downloaded models ==="
          lemonade list --downloaded
          lemonade list --downloaded | grep 'Tiny-Test-Model-GGUF' | grep -q 'Yes'
          echo "Baseline model present."

      - name: Stop stable lemond
        if: steps.stable.outputs.skipped != 'true'
        shell: bash
        run: |
          pkill -u lemonade -f '/usr/bin/lemond' || true
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:13305/live >/dev/null 2>&1 || break
            sleep 1
          done

      - name: Upgrade to the new build
        if: steps.stable.outputs.skipped != 'true'
        shell: bash
        run: |
          set -e
          DEB=$(ls new-deb/lemonade-server_*_amd64.deb 2>/dev/null | head -n1)
          if [ -z "$DEB" ]; then
            echo "ERROR: new lemonade-server .deb not found"; ls -la new-deb; exit 1
          fi
          echo "Upgrading to $DEB"
          # git-describe versions can sort below the stable tag, so allow downgrades.
          apt-get install -y --allow-downgrades "./$DEB" \
            || { apt-get -f install -y; apt-get install -y --allow-downgrades "./$DEB"; }
          echo "Upgraded version: $(dpkg-query -W -f='${Version}' lemonade-server)"

      - name: Start upgraded lemond
        if: steps.stable.outputs.skipped != 'true'
        uses: ./.github/actions/start-lemond-service
        with:
          port: '13305'
          log-name: 'lemonade-server.log'

      - name: Assert config and model survived the upgrade
        if: steps.stable.outputs.skipped != 'true'
        shell: bash
        run: |
          set -e
          echo "=== health ==="
          curl -sf "http://127.0.0.1:${LEMONADE_PORT:-13305}/api/v1/health"; echo

          echo "=== config after upgrade ==="
          lemonade config
          if ! lemonade config | grep -qiE 'log_level.*debug'; then
            echo "FAIL: log_level=debug did not survive the upgrade"; exit 1
          fi

          echo "=== downloaded models after upgrade ==="
          lemonade list --downloaded
          if ! lemonade list --downloaded | grep 'Tiny-Test-Model-GGUF' | grep -q 'Yes'; then
            echo "FAIL: Tiny-Test-Model-GGUF was lost during the upgrade"; exit 1
          fi
          echo "PASS: config and model survived the upgrade."

      - name: Capture server logs
        if: always()
        uses: ./.github/actions/capture-server-logs
        with:
          artifact-name: upgrade-test-logs-${{ matrix.codename }}

      - name: Print stable-run log
        if: always()
        shell: bash
        run: |
          echo "=== stable run log ==="
          cat "$RUNNER_TEMP/lemonade-server-stable.log" 2>/dev/null || echo "(none)"

  upload-stable:
    name: Upload (Stable)
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.package_matrix) }}
    needs: [prepare-matrix, package]
    permissions:
      contents: read
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/upload.yml
    with:
      target: ppa:lemonade-team/stable
      artifact: lemonade-${{ matrix.codename }}-source-package
    secrets: inherit

  upload-bleeding-edge:
    name: Upload (Bleeding Edge)
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.package_matrix) }}
    needs: [prepare-matrix, package]
    permissions:
      contents: read
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/upload.yml
    with:
      target: ppa:lemonade-team/bleeding-edge
      artifact: lemonade-${{ matrix.codename }}-source-package
    secrets: inherit

  # Gate job that ensures: 1. in the merge queue, all jobs in `needs:` ran
  # successfully (otherwise the merge is blocked), and 2. these jobs do not need
  # to run on ordinary pull request pushes.
  gate:
    name: Launchpad PPA builds
    needs: [prepare-matrix, package, package-arm64, upgrade-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gated jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # $NEEDS: {"job-id": {"result": "success|failure|skipped|cancelled"}, ...}
          # Fail if any job broke. In the merge queue, also fail if any never ran.
          echo "$NEEDS"
          broke=$(jq -r 'to_entries[]|select(.value.result=="failure" or .value.result=="cancelled")|.key' <<<"$NEEDS")
          if [ -n "$broke" ]; then
            echo "FAILED: $broke"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            absent=$(jq -r 'to_entries[]|select(.value.result!="success")|.key' <<<"$NEEDS")
            if [ -n "$absent" ]; then
              echo "DID NOT RUN IN MERGE QUEUE: $absent"
              exit 1
            fi
          fi
