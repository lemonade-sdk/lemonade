name: Publish the repo-manager Container

on:
  # Weekly, so the base image's security updates land without anyone asking, and so a
  # tag that was only ever built on a runner gets into the registry on its own.
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
  # A version bump is a one-line edit to versions.env; publish the image it describes as
  # soon as that lands, so runner-side builds stay the exception.
  push:
    branches:
      - main
    paths:
      - .github/actions/repo-manager/Dockerfile
      - .github/actions/repo-manager/versions.env
      - .github/workflows/build-repo-manager-container.yml
  # Build without publishing on changes to how the image is built. Nothing else exercises
  # the Dockerfile before the self-hosted jobs that depend on it do.
  pull_request:
    paths:
      - .github/actions/repo-manager/Dockerfile
      - .github/actions/repo-manager/versions.env
      - .github/workflows/build-repo-manager-container.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-repo-manager-container:
    name: Build the repo-manager image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' .github/actions/repo-manager/versions.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lemonade-sdk/lemonade/repo-manager
          # The repo-manager version is what the action asks for by name. `latest` is for
          # people looking the image up by hand; nothing in CI resolves it.
          tags: |
            type=raw,value=${{ env.REPO_MANAGER_VERSION }}
            type=raw,value=latest

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          # The action's own directory: it holds the Dockerfile, the versions the image is
          # built from, and nothing large.
          context: .github/actions/repo-manager
          build-args: |
            REPO_MANAGER_VERSION=${{ env.REPO_MANAGER_VERSION }}
            LEMONADE_VERSION=${{ env.LEMONADE_VERSION }}
            GH_CLI_VERSION=${{ env.GH_CLI_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          # The lemonade build this image carries is an x64 one, and every runner that
          # runs repo-manager is X64.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'lemonade-repo-manager:test' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same reasoning as the build-environment image: the layer cache lives in the
          # registry rather than in the 10 GB Actions cache the Windows installer jobs
          # depend on.
          cache-from: type=registry,ref=ghcr.io/lemonade-sdk/lemonade/repo-manager:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,mode=max,ref=ghcr.io/lemonade-sdk/lemonade/repo-manager:buildcache' || '' }}

      - name: Verify the image carries the pinned tools
        # On the publish path this pulls the tag that was just pushed, so what is checked
        # is what the self-hosted jobs will run.
        shell: bash
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'lemonade-repo-manager:test' || format('ghcr.io/lemonade-sdk/lemonade/repo-manager:{0}', env.REPO_MANAGER_VERSION) }}
        run: |
          set -euo pipefail

          docker run --rm "$IMAGE" bash -c 'repo-manager --version && pi --version && gh --version && "$LEMOND" --version'

          # The action compares this against the checkout and rebuilds on the runner when
          # they differ, so a mismatch here means every job pays for a build it should not.
          docker run --rm "$IMAGE" cat /opt/versions.env \
            | diff - .github/actions/repo-manager/versions.env
