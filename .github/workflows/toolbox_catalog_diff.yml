name: Diff Toolbox Catalog

# Donato Capitella's AI Toolbox Cockpit catalog is where the toolbox images and
# their curated models are maintained. This workflow re-runs the translation
# script against the catalog's current state and opens one PR describing what
# changed: new or retired toolbox tags, new DS4 models, changed launch defaults,
# changed Halogen bundles. Nothing merges automatically.

on:
  workflow_dispatch:
  schedule:
    # Monday at 06:20 UTC, after the digest refresh.
    - cron: "20 6 * * 1"

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  diff:
    name: Diff the upstream catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Summarize what changed upstream
        run: python3 docs/tools/gen_toolbox_catalog.py report | tee catalog_report.md

      - name: Regenerate the catalog-owned model entries
        id: regen
        run: |
          python3 docs/tools/gen_toolbox_catalog.py models --write
          if git diff --quiet src/cpp/resources/server_models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the PR body
        if: steps.regen.outputs.changed == 'true'
        run: |
          {
            echo "Sweet - the upstream toolbox catalog changed. This regenerates the entries"
            echo "\`docs/tools/gen_toolbox_catalog.py\` owns (everything marked"
            echo "\`catalog_source: ai-toolbox-cockpit\`) and leaves the hand-curated ROCmFPX"
            echo "picks alone."
            echo
            echo "A model added upstream arrives here with a slug for a name. Give it a short"
            echo "one in \`NAME_OVERRIDES\` before merging."
            echo
            cat catalog_report.md
          } > pr_body.md

      - name: Open the catalog PR
        if: steps.regen.outputs.changed == 'true'
        run: |
          BRANCH="toolbox-catalog-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/cpp/resources/server_models.json
          git commit -m "Sync toolbox catalog model entries"
          git push origin "$BRANCH"
          gh pr create \
            --title "Sync toolbox catalog model entries" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH"

      - name: Publish the report when nothing needs a PR
        if: steps.regen.outputs.changed != 'true'
        run: cat catalog_report.md >> "$GITHUB_STEP_SUMMARY"
