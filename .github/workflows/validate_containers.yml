name: Update Container Backend Images

# Keeps every container backend on the newest build of its tag. Each pin in
# backend_versions.json is <tag>@<digest>; this workflow moves only the digest,
# and a maintainer sets the tag by hand. The update PR carries the ci:backends
# label, so test-container-backends in cpp_server_build_test_release.yml
# validates the new digests before merge.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validate_containers.yml'
      - 'src/cpp/resources/backend_versions.json'
      - 'src/cpp/include/lemon/backends/**'
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update image digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pin the newest digest of each tag
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import re
          import urllib.error
          import urllib.request

          PIN_RE = re.compile(r"^(?P<tag>[^@]+)@(?P<digest>sha256:[0-9a-f]{64})$")
          RECIPE_RE = re.compile(r'/\*recipe\*/\s*"([^"]+)"')
          POLICY_RE = re.compile(r'\{"([^"]+)",\s*\{\s*/\*image\*/\s*"([^"]+)"')
          ACCEPT = ", ".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
          ])

          images = {}
          for header in glob.glob("src/cpp/include/lemon/backends/*/*.h"):
              text = open(header, encoding="utf-8").read()
              recipe = RECIPE_RE.search(text)
              if not recipe:
                  continue
              for backend, image in POLICY_RE.findall(text):
                  images[(recipe.group(1), backend)] = image

          path = "src/cpp/resources/backend_versions.json"
          versions = json.load(open(path, encoding="utf-8"))
          pinned = {
              (recipe, backend)
              for recipe, backends in versions.items() if isinstance(backends, dict)
              for backend, pin in backends.items() if isinstance(pin, str) and PIN_RE.match(pin)
          }
          if not images or pinned - images.keys():
              missing = ", ".join(f"{r}:{b}" for r, b in sorted(pinned - images.keys()))
              raise SystemExit(
                  "No container image found in the backend descriptors for: "
                  + (missing or "any backend")
                  + ". Update RECIPE_RE or POLICY_RE to match the descriptor format.")

          def newest_digest(image, tag):
              registry, name = image.split("/", 1)
              if registry == "docker.io":
                  token_url = (
                      "https://auth.docker.io/token?service=registry.docker.io"
                      f"&scope=repository:{name}:pull"
                  )
                  manifest_url = f"https://registry-1.docker.io/v2/{name}/manifests/{tag}"
              elif registry == "ghcr.io":
                  token_url = f"https://ghcr.io/token?scope=repository:{name}:pull"
                  manifest_url = f"https://ghcr.io/v2/{name}/manifests/{tag}"
              else:
                  raise SystemExit(f"Unsupported registry for {image}")
              request = urllib.request.Request(manifest_url, method="HEAD", headers={"Accept": ACCEPT})
              try:
                  with urllib.request.urlopen(token_url, timeout=30) as response:
                      token = json.load(response)["token"]
                  request.add_header("Authorization", f"Bearer {token}")
                  with urllib.request.urlopen(request, timeout=30) as response:
                      digest = response.headers.get("Docker-Content-Digest")
              except urllib.error.HTTPError as e:
                  raise SystemExit(
                      f"{image}:{tag} returned HTTP {e.code}. If the tag was removed "
                      "upstream, a maintainer must pin a new tag in backend_versions.json.")
              if not digest:
                  raise SystemExit(f"{image}:{tag} returned no Docker-Content-Digest header")
              return digest

          rows = []
          for (recipe, backend), image in sorted(images.items()):
              pin = versions.get(recipe, {}).get(backend, "")
              match = PIN_RE.match(pin)
              if not match:
                  raise SystemExit(f"{recipe}:{backend} is not pinned to <tag>@<digest>: {pin!r}")
              tag, digest = match.group("tag"), match.group("digest")
              latest = newest_digest(image, tag)
              state = "current" if latest == digest else "new digest"
              print(f"{recipe}:{backend} {image}:{tag} pinned {digest[:19]} newest {latest[:19]} ({state})")
              if latest != digest:
                  versions[recipe][backend] = f"{tag}@{latest}"
                  rows.append(
                      f"| `{recipe}:{backend}` | `{image}:{tag}` | `{digest[:19]}` | `{latest[:19]}` |"
                  )

          with open(path, "w", encoding="utf-8") as out:
              json.dump(versions, out, indent=2)
              out.write("\n")
          with open("pr_body.md", "w", encoding="utf-8") as out:
              out.write("| Backend | Image | Old digest | New digest |\n|---|---|---|---|\n")
              out.write("\n".join(rows) + "\n")
          PY
          git diff src/cpp/resources/backend_versions.json

      # GH_TOKEN, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN triggers no
      # workflows, so the ci:backends label would never start the tests.
      - name: Create Pull Request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet src/cpp/resources/backend_versions.json; then
            echo "Every pin is on the newest digest of its tag."
            exit 0
          fi

          BRANCH="auto/container-pins-$(sha256sum src/cpp/resources/backend_versions.json | cut -c1-12)"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/cpp/resources/backend_versions.json
          git commit -m "Update container backend images to the newest digest of each tag"
          git push origin "$BRANCH"

          gh pr create \
            --title "Update container backend image digests" \
            --body-file pr_body.md \
            --label ci:backends \
            --base main \
            --head "$BRANCH"
