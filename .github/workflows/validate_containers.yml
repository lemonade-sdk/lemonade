name: Update Container Backend Images

# Keeps every container backend on the newest image upstream publishes. Each
# pin in backend_versions.json is <tag>@<digest>. A tag with version numbers,
# such as 0.18.22, moves to the highest-numbered tag of the same shape; every
# pin then moves to its tag's newest digest. The update PR is opened the same
# way as validate_llamacpp.yml's.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validate_containers.yml'
      - 'src/cpp/resources/backend_versions.json'
      - 'src/cpp/include/lemon/backends/**'
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pin the newest tag and digest of each image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          PIN_RE = re.compile(r"^(?P<tag>[^@]+)@(?P<digest>sha256:[0-9a-f]{64})$")
          RECIPE_RE = re.compile(r'/\*recipe\*/\s*"([^"]+)"')
          POLICY_RE = re.compile(r'\{"([^"]+)",\s*\{\s*/\*image\*/\s*"([^"]+)"')
          NEXT_RE = re.compile(r'<([^>]+)>;\s*rel="next"')
          ACCEPT = ", ".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
          ])

          images = {}
          for header in glob.glob("src/cpp/include/lemon/backends/*/*.h"):
              text = open(header, encoding="utf-8").read()
              recipe = RECIPE_RE.search(text)
              if not recipe:
                  continue
              for backend, image in POLICY_RE.findall(text):
                  images[(recipe.group(1), backend)] = image

          path = "src/cpp/resources/backend_versions.json"
          versions = json.load(open(path, encoding="utf-8"))
          pinned = {
              (recipe, backend)
              for recipe, backends in versions.items() if isinstance(backends, dict)
              for backend, pin in backends.items() if isinstance(pin, str) and PIN_RE.match(pin)
          }
          if not images or pinned - images.keys():
              missing = ", ".join(f"{r}:{b}" for r, b in sorted(pinned - images.keys()))
              raise SystemExit(
                  "No container image found in the backend descriptors for: "
                  + (missing or "any backend")
                  + ". Update RECIPE_RE or POLICY_RE to match the descriptor format.")

          class Registry:
              def __init__(self, image):
                  host, self.name = image.split("/", 1)
                  if host == "docker.io":
                      self.base = "https://registry-1.docker.io"
                      token_url = (
                          "https://auth.docker.io/token?service=registry.docker.io"
                          f"&scope=repository:{self.name}:pull"
                      )
                  elif host == "ghcr.io":
                      self.base = "https://ghcr.io"
                      token_url = f"https://ghcr.io/token?scope=repository:{self.name}:pull"
                  else:
                      raise SystemExit(f"Unsupported registry for {image}")
                  self.image = image
                  with urllib.request.urlopen(token_url, timeout=30) as response:
                      self.token = json.load(response)["token"]

              def request(self, url, method="GET", accept=None):
                  headers = {"Authorization": f"Bearer {self.token}"}
                  if accept:
                      headers["Accept"] = accept
                  request = urllib.request.Request(url, method=method, headers=headers)
                  try:
                      return urllib.request.urlopen(request, timeout=30)
                  except urllib.error.HTTPError as e:
                      raise SystemExit(f"{self.image}: {url} returned HTTP {e.code}")

              def tags(self):
                  tags = []
                  url = f"{self.base}/v2/{self.name}/tags/list?n=1000"
                  while url:
                      with self.request(url) as response:
                          tags += json.load(response).get("tags") or []
                          link = NEXT_RE.search(response.headers.get("Link", ""))
                      url = urllib.parse.urljoin(self.base, link.group(1)) if link else None
                  return tags

              def digest(self, tag):
                  url = f"{self.base}/v2/{self.name}/manifests/{tag}"
                  with self.request(url, method="HEAD", accept=ACCEPT) as response:
                      digest = response.headers.get("Docker-Content-Digest")
                  if not digest:
                      raise SystemExit(f"{self.image}:{tag} returned no Docker-Content-Digest header")
                  return digest

          # Only a tag of the same shape is a newer version of the pinned one:
          # rocm-10.0 may move to rocm-10.1 but not to rocm-10.0_20261103T122023
          # or rocm-10.0-gufo. A tag with no numbers, such as latest, never moves.
          def shape(tag):
              return re.sub(r"\d+", "#", tag)

          def numbers(tag):
              return tuple(int(n) for n in re.findall(r"\d+", tag))

          def newest_tag(tag, registry):
              if "#" not in shape(tag):
                  return tag
              same_shape = [t for t in registry.tags() if shape(t) == shape(tag)]
              return max([tag] + same_shape, key=numbers)

          rows = []
          for (recipe, backend), image in sorted(images.items()):
              pin = versions.get(recipe, {}).get(backend, "")
              match = PIN_RE.match(pin)
              if not match:
                  raise SystemExit(f"{recipe}:{backend} is not pinned to <tag>@<digest>: {pin!r}")
              tag, digest = match.group("tag"), match.group("digest")
              registry = Registry(image)
              new_tag = newest_tag(tag, registry)
              new_digest = registry.digest(new_tag)
              new_pin = f"{new_tag}@{new_digest}"
              state = "current" if new_pin == pin else "update"
              print(f"{recipe}:{backend} {image} {tag}@{digest[:19]} -> {new_tag}@{new_digest[:19]} ({state})")
              if new_pin != pin:
                  versions[recipe][backend] = new_pin
                  rows.append(
                      f"| `{recipe}:{backend}` | `{image}` "
                      f"| `{tag}@{digest[:19]}` | `{new_tag}@{new_digest[:19]}` |"
                  )

          with open(path, "w", encoding="utf-8") as out:
              json.dump(versions, out, indent=2)
              out.write("\n")
          with open("pr_body.md", "w", encoding="utf-8") as out:
              out.write("| Backend | Image | Old pin | New pin |\n|---|---|---|---|\n")
              out.write("\n".join(rows) + "\n")
          PY
          git diff src/cpp/resources/backend_versions.json

      - name: Create Pull Request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/container-pins-$(sha256sum src/cpp/resources/backend_versions.json | cut -c1-12)"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet src/cpp/resources/backend_versions.json; then
            echo "backend_versions.json is unchanged — nothing to update."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add src/cpp/resources/backend_versions.json
          git commit -m "Update container backend image pins"
          git push origin "$BRANCH"

          gh pr create \
            --title "Update container backend image pins" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH"
