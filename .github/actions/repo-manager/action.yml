name: 'Repo Manager'
description: >-
  Run one repo-manager command on a self-hosted runner: pull the container image holding
  its pinned tools, serve the model from a lemond inside that container, and commit the
  result to lemonade-sdk/lemonade-testing.

inputs:
  command:
    description: 'repo-manager command and arguments, for example "commit review <sha>".'
    required: true
  app-client-id:
    description: >-
      Client ID of the GitHub App that may push to lemonade-sdk/lemonade-testing, the
      repository where repo-manager keeps its results.
    required: true
  app-private-key:
    description: 'Private key of that app. A composite action cannot read `secrets` itself.'
    required: true

runs:
  using: composite
  steps:
    - name: Pin versions and locate the machine-level cache
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Comments and blank lines are not valid in $GITHUB_ENV, so only assignments go.
        grep -E '^[A-Z0-9_]+=' "$ACTION_PATH/versions.env" >> "$GITHUB_ENV"
        # shellcheck source=/dev/null
        . "$ACTION_PATH/versions.env"

        # The tools come from the image; lemond's cache cannot, because the model in it is
        # 23GB. Locate it from the passwd database: other jobs on these runners redirect
        # HOME into their workspace, and a wrong value here would put the cache somewhere
        # that gets wiped.
        home=$(getent passwd "$(id -u)" | cut -d: -f6)
        test -n "$home"
        lemond_cache="$home/.cache/lemonade-ci/repo-manager"

        # pi writes its provider config and skills under HOME, so the container is given a
        # per-job one instead of the runner's.
        rm_home="$RUNNER_TEMP/home"
        logs="$RUNNER_TEMP/lemond-logs"

        # Registry credentials go in a per-job config rather than the shared home: two of
        # these jobs can run on one machine, and one of them logging out must not cancel
        # the other's login.
        docker_config="$RUNNER_TEMP/docker"

        mkdir -p "$lemond_cache" "$rm_home" "$logs" "$docker_config"
        {
          echo "LEMOND_CACHE=$lemond_cache"
          echo "RM_HOME=$rm_home"
          echo "LEMOND_LOGS=$logs"
          echo "DOCKER_CONFIG=$docker_config"
          echo "RM_IMAGE=ghcr.io/lemonade-sdk/lemonade/repo-manager:${REPO_MANAGER_VERSION}"
          # Several of these jobs share a runner, so the name cannot be a constant.
          echo "RM_CONTAINER=repo-manager-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$$"
        } >> "$GITHUB_ENV"

    - name: Get the repo-manager image
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GHCR_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        if ! command -v docker > /dev/null; then
          echo "::error title=This runner has no Docker::repo-manager runs in a container; see docs/dev/self-hosted-runners.md for what a Linux runner in the production pool needs."
          exit 1
        fi

        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

        # The image carries the versions.env it was built from, so a tag that exists but
        # predates the last bump is detected rather than silently used.
        current_image() {
          docker run --rm "$RM_IMAGE" cat /opt/versions.env 2>/dev/null \
            | diff -q - "$ACTION_PATH/versions.env" > /dev/null 2>&1
        }

        # A version bump reaches main as a one-line edit, and the review of that very
        # commit starts before the image build it triggers can finish. Building here when
        # the registry is behind keeps a bump from being blocked on infrastructure; it is
        # the same recipe either way, and the weekly publish keeps this the exception.
        if ! docker pull --quiet "$RM_IMAGE" || ! current_image; then
          echo "::warning title=Building the repo-manager image on the runner::$RM_IMAGE is missing from the registry or was built before the last version bump."
          docker build \
            --build-arg "REPO_MANAGER_VERSION=$REPO_MANAGER_VERSION" \
            --build-arg "LEMONADE_VERSION=$LEMONADE_VERSION" \
            --build-arg "GH_CLI_VERSION=$GH_CLI_VERSION" \
            --build-arg "NODE_VERSION=$NODE_VERSION" \
            --tag "$RM_IMAGE" "$ACTION_PATH"
          current_image
        fi

    - uses: actions/create-github-app-token@v3
      id: state-token
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: lemonade-sdk
        repositories: lemonade-testing

    - name: Clone the repository repo-manager writes to
      uses: actions/checkout@v5
      with:
        repository: lemonade-sdk/lemonade-testing
        token: ${{ steps.state-token.outputs.token }}
        path: state
        fetch-depth: 1
        persist-credentials: true

    - name: Give that clone a committer
      shell: bash
      run: |
        set -euo pipefail
        git -C "$GITHUB_WORKSPACE/state" config user.name "Lemonade Bot"
        git -C "$GITHUB_WORKSPACE/state" config user.email "lemonade@amd.com"

    - name: Clone lemonade for git and diff operations
      uses: actions/checkout@v5
      with:
        path: checkout
        fetch-depth: 0
        fetch-tags: true

    - name: Run repo-manager
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        COMMAND: ${{ inputs.command }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Device access is what makes the model usable at all; the group IDs behind those
        # devices differ per machine, so they are resolved here rather than baked in.
        devices=(--device /dev/dri)
        if [ -e /dev/kfd ]; then
          devices+=(--device /dev/kfd)
        fi
        group_args=()
        for group in render video; do
          gid=$(getent group "$group" | cut -d: -f3 || true)
          if [ -n "$gid" ]; then
            group_args+=(--group-add "$gid")
          fi
        done

        # As the runner's own uid, so that the clones this job leaves behind stay
        # deletable by the jobs that follow it on this machine.
        docker run --rm --name "$RM_CONTAINER" \
          --user "$(id -u):$(id -g)" \
          "${devices[@]}" \
          "${group_args[@]}" \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --volume "$LEMOND_CACHE:/cache" \
          --volume "$RM_HOME:/rm-home" \
          --volume "$LEMOND_LOGS:/logs" \
          --volume "$ACTION_PATH/run.sh:/run.sh:ro" \
          --workdir /workspace \
          --env HOME=/rm-home \
          --env HF_HOME=/cache \
          --env COMMAND \
          --env GH_TOKEN \
          --env REPO_MANAGER_MODEL \
          "$RM_IMAGE" bash /run.sh

    - name: Show the model server log
      if: failure()
      shell: bash
      run: tail -n 100 "$LEMOND_LOGS/lemond.stderr.log" 2>/dev/null || true

    - name: Clean up
      if: always()
      shell: bash
      run: |
        # A cancelled job leaves the container behind, and --rm never gets to run.
        docker rm --force "$RM_CONTAINER" > /dev/null 2>&1 || true
        docker logout ghcr.io > /dev/null 2>&1 || true
