name: 'Repo Manager'
description: >-
  Run one repo-manager command. The calling job supplies the tools by running in the
  repo-manager container; this starts a lemond in it to serve the model, and commits the
  result to lemonade-sdk/lemonade-testing.

inputs:
  command:
    description: 'repo-manager command and arguments, for example "commit review <sha>".'
    required: true
  app-client-id:
    description: >-
      Client ID of the GitHub App that may push to lemonade-sdk/lemonade-testing, the
      repository where repo-manager keeps its results.
    required: true
  app-private-key:
    description: 'Private key of that app. A composite action cannot read `secrets` itself.'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@v3
      id: state-token
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: lemonade-sdk
        repositories: lemonade-testing

    - name: Clone the repository repo-manager writes to
      uses: actions/checkout@v5
      with:
        repository: lemonade-sdk/lemonade-testing
        token: ${{ steps.state-token.outputs.token }}
        path: state
        fetch-depth: 1
        persist-credentials: true

    - name: Give that clone a committer
      shell: bash
      run: |
        set -euo pipefail
        git -C "$GITHUB_WORKSPACE/state" config user.name "Lemonade Bot"
        git -C "$GITHUB_WORKSPACE/state" config user.email "lemonade@amd.com"

    - name: Clone lemonade for git and diff operations
      uses: actions/checkout@v5
      with:
        path: checkout
        fetch-depth: 0
        fetch-tags: true

    - name: Run repo-manager
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        COMMAND: ${{ inputs.command }}
        GH_TOKEN: ${{ github.token }}
        REPO_MANAGER_MODEL: Qwen3.6-35B-A3B-MTP-GGUF
      run: |
        set -euo pipefail
        logs="$RUNNER_TEMP/lemond-logs"
        mkdir -p "$logs"

        # The weights are the one thing the image cannot carry, at 23GB. They go beside
        # the benchmark job's cache, which runs on these same machines: outside the
        # workspace `clean: true` wipes, and outside RUNNER_TEMP, which is wiped between
        # jobs. Container jobs see it without a mount because the runner's work directory
        # is already mounted whole.
        export HF_HOME="$RUNNER_WORKSPACE/hf-cache"
        cache="$RUNNER_WORKSPACE/lemond-repo-manager-cache"
        mkdir -p "$HF_HOME" "$cache"

        # Vulkan reports mesa's llvmpipe software device even when no GPU was passed in,
        # so llama.cpp would run without complaint — on the CPU, turning a review into an
        # overnight job. Only a real GPU counts.
        if ! vulkaninfo --summary 2>/dev/null | grep -q 'deviceType.*PHYSICAL_DEVICE_TYPE_[A-Z_]*GPU'; then
          echo "::error title=No GPU reached the container::Check that the runner account is in the render and video groups and that the job passes --device /dev/dri --device /dev/kfd. Vulkan sees only:"
          vulkaninfo --summary 2>&1 | sed -n '/Devices:/,$p' | head -40
          exit 1
        fi

        # A fixed port is safe because the container has its own network namespace.
        # --no-broadcast because this server is private to the job and has no business
        # answering discovery on the lab network.
        PORT=8000
        "$LEMOND" "$cache" --port "$PORT" --host 127.0.0.1 --no-broadcast \
          > "$logs/lemond.stdout.log" 2> "$logs/lemond.stderr.log" &
        LEMOND_PID=$!

        healthy=false
        for _ in $(seq 1 60); do
          if curl -sf "http://127.0.0.1:$PORT/api/v1/health" > /dev/null 2>&1; then
            healthy=true
            break
          fi
          kill -0 "$LEMOND_PID" 2>/dev/null || break
          sleep 2
        done
        if [ "$healthy" != true ]; then
          echo "::error title=lemond never became healthy::"
          tail -n 50 "$logs/lemond.stderr.log" || true
          exit 1
        fi

        # Not `curl -f`: a failed pull answers with the reason in its body, and -f throws
        # that away and reports only its own exit code.
        code=$(curl -s -o "$logs/pull.json" -w '%{http_code}' \
          -X POST "http://127.0.0.1:$PORT/api/v1/pull" \
          -H "Content-Type: application/json" \
          -d "{\"model_name\": \"${REPO_MANAGER_MODEL}\"}")
        if [ "$code" != "200" ] || [ "$(jq -r '.status // ""' < "$logs/pull.json")" != "success" ]; then
          echo "::error title=Could not pull $REPO_MANAGER_MODEL::lemond answered HTTP $code"
          cat "$logs/pull.json"
          exit 1
        fi
        du -sh "$HF_HOME"

        export REPO_MANAGER_LEMONADE_URL="http://127.0.0.1:$PORT/v1"
        export REPO_MANAGER_PI_MODEL="Lemonade/${REPO_MANAGER_MODEL}"
        repo-manager pi setup

        # $COMMAND is a command line, not one argument.
        # shellcheck disable=SC2086
        repo-manager $COMMAND --repo lemonade-sdk/lemonade --checkout checkout --state state

    - name: Show the model server log
      if: failure()
      shell: bash
      run: tail -n 100 "$RUNNER_TEMP/lemond-logs/lemond.stderr.log" 2>/dev/null || true

    - name: Leave the workspace owned by the runner account
      if: always()
      shell: bash
      run: |
        # This job is root inside the container, so everything it wrote is root-owned on
        # the machine. The runner's own work directory shows who that account is; without
        # this the next job on this machine cannot clean the workspace.
        work_root="${RUNNER_WORKSPACE%/*}"
        chown -R --reference="$work_root" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
