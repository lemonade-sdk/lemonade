name: Prepare Debian Build
description: Calculate the version and create Debian packaging metadata from template

inputs:
  release:
    description: Ubuntu version (e.g., 24.04, 26.04)
    required: true
  codename:
    description: Debian codename (e.g., noble, resolute)
    required: true

outputs:
  version:
    description: Debian version (version without leading 'v')
    value: ${{ steps.get_version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Calculate version
      id: get_version
      shell: bash
      run: |
        set -e
        VERSION=$(python3 tools/version.py)
        printf '%s\n' "$VERSION" > .version
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Verify committed Mermaid assets for offline source packaging
      shell: bash
      run: |
        set -e
        python3 -m unittest discover -s test -p 'vendor_mermaid_test.py'
        python3 tools/vendor_mermaid.py --check --require-tracked

    - name: Create Debian packaging metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -e
        mv contrib/debian .
        sed -e "s|@@DEB_VERSION@@|${{ steps.get_version.outputs.version }}~${{ inputs.release }}|g" \
            -e "s|@@DEB_CODENAME@@|${{ inputs.codename }}|g" \
            -e "s|@@DEB_DATE@@|$(date -R)|g" \
            debian/changelog.in > debian/changelog
