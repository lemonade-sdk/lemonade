name: Prepare Debian Build
description: Extract version from git and create Debian packaging metadata from template

inputs:
  release:
    description: Ubuntu version (e.g., 24.04, 25.10, 26.04)
    required: true
  codename:
    description: Debian codename (e.g., noble, questing, resolute)
    required: true
  version:
    description: Optional normalized Debian package version override.
    required: false
    default: ""

outputs:
  version:
    description: Debian version (version without leading 'v')
    value: ${{ steps.get_version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Get package version
      id: get_version
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ -n "$REQUESTED_VERSION" ]]; then
          DEB_VERSION="$REQUESTED_VERSION"
        else
          # Preserve the historical fallback for non-PPA callers. Published PPA
          # builds always pass an explicit, normalized version from the release
          # classifier and never depend on git describe for channel ordering.
          VERSION=$(git describe --tags --always)
          DEB_VERSION="${VERSION#v}"
        fi

        echo "Debian version: $DEB_VERSION"
        echo "version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Create Debian packaging metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -e
        mv contrib/debian .
        sed -e "s|@@DEB_VERSION@@|${{ steps.get_version.outputs.version }}~${{ inputs.release }}|g" \
            -e "s|@@DEB_CODENAME@@|${{ inputs.codename }}|g" \
            -e "s|@@DEB_DATE@@|$(date -R)|g" \
            debian/changelog.in > debian/changelog
