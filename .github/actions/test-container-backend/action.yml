name: 'Test a container backend'
description: 'Installs Lemonade from the .deb, installs one container backend, and runs server_llm.py against it'
inputs:
  recipe:
    description: 'Recipe of the container backend, such as ds4'
    required: true
  backend:
    description: 'Backend of the container backend, such as rocm'
    required: true
  version:
    description: 'Version string of the .deb package to install'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set HF_HOME environment variable
      shell: bash
      run: |
        HF_HOME="$RUNNER_TEMP/huggingface"
        mkdir -p "$HF_HOME"
        echo "HF_HOME=$HF_HOME" >> $GITHUB_ENV

    - name: Print the container tool version
      shell: bash
      run: podman --version 2>/dev/null || docker --version

    - name: Install Lemonade (.deb)
      uses: ./.github/actions/install-lemonade-deb
      with:
        version: ${{ inputs.version }}
        port: auto

    - name: Setup Python and virtual environment
      uses: ./.github/actions/setup-venv
      with:
        venv-name: '.venv'
        python-version: '3.10'
        requirements-file: 'test/requirements.txt'

    - name: Install the container backend
      shell: bash
      run: |
        set -e
        lemonade config set enable_containers=true --yes
        lemonade backends
        lemonade backends install ${{ inputs.recipe }}:${{ inputs.backend }}

    - name: Run tests
      shell: bash
      run: |
        set -e
        .venv/bin/python test/server_llm.py --wrapped-server ${{ inputs.recipe }} \
          --backend ${{ inputs.backend }} --cli-binary lemonade
