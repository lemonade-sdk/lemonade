name: Check ROCm path depth
description: >-
  Verify the installed ROCm runtime keeps rocBLAS' Tensile solution files inside
  Windows' path limit, and that the product can still find them where it looks.

inputs:
  cache-dir:
    description: lemond cache root that was used for this run
    required: true

runs:
  using: composite
  steps:
    - shell: PowerShell
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        $ErrorActionPreference = "Stop"

        # Windows resolves a full path against MAX_PATH (260) including the
        # terminator, so 259 usable characters.
        $maxPath = 259

        $cacheDir = $env:CACHE_DIR
        if (-not $cacheDir) {
            Write-Host "::warning::Cache dir was never set; the job likely failed before lemond started."
            exit 0
        }
        $cacheDir = $cacheDir.TrimEnd('\')

        function Check-Layout($root, $name) {
            if (-not (Test-Path -LiteralPath $root)) { return $false }

            # Windows PowerShell cannot enumerate past MAX_PATH, and swallowing
            # that would under-measure exactly when the answer matters.
            $errs = @()
            $all = @(Get-ChildItem -LiteralPath $root -Recurse -File `
                         -ErrorAction SilentlyContinue -ErrorVariable +errs)
            if ($errs.Count -gt 0) {
                Write-Host "::error::Could not fully enumerate $root ($($errs.Count) error(s)); a path is likely past MAX_PATH. First: $($errs[0].Exception.Message)"
                exit 1
            }

            # rocBLAS is the library that access-violates rather than reporting a
            # failed open, and it keeps its solutions beside its own binary.
            # hipBLASLt ships deeper files named TensileLibrary* too, so scope by
            # path, not by filename.
            $rocblas = @($all | Where-Object { $_.FullName -like '*\rocblas\*' -and $_.Name -like 'TensileLibrary*' } |
                         Sort-Object { $_.FullName.Length } -Descending)
            if ($rocblas.Count -eq 0) {
                Write-Host "::error::ROCm is installed at $root but no rocBLAS Tensile files were found beneath it. The $name layout has moved, which silently disables the product's measurement. Update find_rocblas_data_dir() in src/cpp/server/backends/backend_utils.cpp to match the new layout."
                exit 1
            }

            $longest = $rocblas[0]
            $depth = $longest.FullName.Length - $cacheDir.Length
            $budget = $maxPath - $depth
            Write-Host ("{0,4}  {1}" -f $longest.FullName.Length, $longest.FullName)
            Write-Host "$name rocBLAS sits $depth chars below the cache root, so the longest usable cache dir for this install is $budget chars." -ForegroundColor Green

            if ($longest.FullName.Length -gt $maxPath) {
                Write-Host "::error::Longest rocBLAS path is $($longest.FullName.Length) chars (limit $maxPath); rocBLAS would access-violate. Cache root is $($cacheDir.Length) chars and needs to be $budget or fewer."
                exit 1
            }

            # Everything else only has to be openable, not fault-free.
            $max = ($all | Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1)
            if ($max.FullName.Length -gt $maxPath) {
                Write-Host "::error::Longest path in the $name tree is $($max.FullName.Length) chars (limit $maxPath): $($max.FullName)"
                exit 1
            }
            Write-Host "Longest path anywhere in the $name tree is $($max.FullName.Length) chars (headroom: $($maxPath - $max.FullName.Length))." -ForegroundColor Green
            return $true
        }

        $checked = $false
        if (Check-Layout (Join-Path $cacheDir "bin\therock-wheels") "wheel") { $checked = $true }
        if (Check-Layout (Join-Path $cacheDir "bin\therock") "tarball") { $checked = $true }

        if (-not $checked) {
            Write-Host "::warning::No ROCm runtime found under $cacheDir; nothing to measure."
        }
