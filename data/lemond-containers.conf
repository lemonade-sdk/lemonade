# Drop-in for lemond.service that lets the system service drive rootless
# Podman for the container-backed recipes (rocmfpx, ds4, llamacpp:nathanw).
#
# Rootless Podman needs user namespaces and the setuid newuidmap/newgidmap
# helpers, which the base unit's hardening forbids, and a per-user runtime
# directory that systemd only creates for a logged-in or lingering user. The
# package's post-install script grants the lemonade user subordinate uid/gid
# ranges and enables linger; this file relaxes the two directives that would
# otherwise refuse the namespace setup. Everything else in the base unit stays.
[Service]
RestrictNamespaces=no
NoNewPrivileges=no
Environment=XDG_RUNTIME_DIR=/run/user/%U
