exclude: '\.svg$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/web-app/vendor/mermaid/
      - id: end-of-file-fixer
        exclude: ^src/web-app/vendor/mermaid/
      - id: check-yaml
      - id: check-added-large-files
        # Allow the vendored model-viewer bundle (see src/app/src/renderer/vendor/README.md),
        # which is necessarily larger than 500 KB.
        # Mermaid's upstream ESM chunks and source maps can exceed 500 KB too.
        # Limit the exception to the exact checked-in vendor distribution.
        exclude: ^(src/app/src/renderer/vendor/model-viewer\.min\.js|src/web-app/vendor/mermaid/dist/(?:mermaid\.esm\.mjs|chunks/mermaid\.esm/[^/]+\.mjs)(?:\.map)?)$

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-jsonschema
        files: .*\.json$
        exclude: ^(\.vscode/launch\.json|\.devcontainer/devcontainer\.json)$
        args: ["--schemafile", "schemas/any.json"]
      - id: check-github-actions
      - id: check-github-workflows

  - repo: local
    hooks:
      - id: comment-slop
        name: comment slop (repeated explanations, oversized blocks)
        entry: python tools/check_comment_slop.py
        language: python
        pass_filenames: false
        require_serial: true
        types_or: [c, c++, python]
      - id: vendor-mermaid-integrity
        name: Mermaid vendor integrity (offline)
        entry: python3 tools/vendor_mermaid.py --check
        language: system
        pass_filenames: false
        files: '^(src/web-app/vendor/mermaid/|src/(app|web-app)/package(-lock)?\.json$|tools/vendor_mermaid\.py$)'
